const _submittedScores = new Set();

async function submitGameScore(table, data) {
  if(!currentUser || !authToken) return;

  // Guard against double submissions
  const key = `${table}_${data.score}_${data.difficulty}_${Date.now().toString().slice(0,-3)}`;
  if(_submittedScores.has(key)) return;
  _submittedScores.add(key);
  setTimeout(() => _submittedScores.delete(key), 10000);

  const headers = {
    'apikey': SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${authToken}`,
    'Prefer': 'return=minimal'
  };

  // Only send columns that exist on all leaderboard tables
  const safeData = {
    user_id: data.user_id,
    player_name: data.player_name,
    score: data.score,
    difficulty: data.difficulty
  };

  try {
    // Check for existing score — wrap separately so failure here doesn't block insert
    let existing = null;
    try {
      const rows = await sbFetch(`${table}?user_id=eq.${currentUser.id}&difficulty=eq.${data.difficulty}&select=id,score&limit=1`);
      if(rows && rows.length > 0) existing = rows[0];
    } catch(e) {
      console.warn('Could not check existing score, will attempt insert:', e.message);
    }

    if(existing) {
      // The "This Week" leaderboard filters on created_at, but this row only ever
      // holds the player's all-time best — without refreshing created_at on every
      // play, a player's entry silently ages out of "This Week" the moment a new
      // week starts, even if they keep playing (and winning) every week.
      const now = new Date().toISOString();
      if(data.score <= existing.score) {
        await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${existing.id}`, {
          method: 'PATCH', headers, body: JSON.stringify({ created_at: now })
        }).catch(()=>{});
        showNotBestToast(existing.score);
        return;
      }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${existing.id}`, {
        method: 'PATCH', headers, body: JSON.stringify({ ...safeData, created_at: now })
      });
      if(res.ok) showScoreToast(data.score, table, data.difficulty, true);
      else console.error('Score PATCH failed:', res.status, await res.text());
    } else {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        method: 'POST', headers, body: JSON.stringify(safeData)
      });
      if(res.ok) showScoreToast(data.score, table, data.difficulty, false);
      else console.error('Score POST failed:', res.status, await res.text());
    }
  } catch(e) { console.error('Score submit failed:', e); }
}

  toast.textContent = `🏆 Score of ${score.toLocaleString()} submitted! Tap to view leaderboard`;

let storyRecapQuiz = null;

async function renderStoryPathRecap(pathId) {
  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Preparing your recap…</div></div>`;

  const paths = await sbFetch(`story_paths?id=eq.${pathId}&select=*`);
  const path = paths[0];
  const pool = await sbFetch(`bible_trivia_questions?story_path_slug=eq.${path.slug}&select=*`);

  if(!pool.length) { renderStoryPath(pathId); return; }

  storyRecapQuiz = { pathId, path, questions: shuffle(pool).slice(0, 5), idx: 0, correct: 0 };
  renderStoryRecapQuestion();
}

function renderStoryRecapQuestion() {
  const rq = storyRecapQuiz;

    <div class="fg-page-inner">

function checkStoryRecapAnswer(btn, chosen, correct) {
  const rq = storyRecapQuiz;
  const fb = document.getElementById('storyRecapFeedback');
  const isCorrect = chosen === correct;
  document.querySelectorAll('#storyRecapChoices .story-choice').forEach(b => {
    b.disabled = true;
    if(decodeURIComponent(b.dataset.choice) === correct) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  if(isCorrect) rq.correct++;
  if(fb) { fb.className = `story-feedback ${isCorrect ? 'correct' : 'wrong'}`; fb.textContent = isCorrect ? '✓ Correct!' : `✗ Correct answer: ${correct}`; }

  setTimeout(() => {
    rq.idx++;
    if(rq.idx < rq.questions.length) renderStoryRecapQuestion();
    else renderStoryRecapComplete();
  }, 1600);
}

async function completeStoryChapter(pathId, chapterNum, stars) {
  storyProgress[pathId] = Math.max(storyProgress[pathId] || 0, chapterNum);
  if(!currentUser || !authToken) return;

  try {
    const pathChapters = await sbFetch(`story_chapters?path_id=eq.${pathId}&select=chapter_num&order=chapter_num.desc&limit=1`);
    const totalChapters = pathChapters.length ? pathChapters[0].chapter_num : 10;
    const isCompleted = chapterNum >= totalChapters;

    // upsert_story_progress (not a raw insert) so replaying a chapter updates
    // the existing row instead of piling up a new one every time — stars only
    // ever move up (GREATEST) and completed only ever moves to true (OR), so a
    // lower-scoring replay can't regress an already-recorded best.
    await fetch(`${SUPABASE_URL}/rest/v1/rpc/upsert_story_progress`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authToken}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        p_path_id: pathId,
        p_chapter_num: chapterNum,
        p_stars: stars,
        p_completed: isCompleted
      })
    });

    await updateStreak();

  } catch(e) { console.error('Story save error:', e); }
}

// HEART TIMER SYSTEM
// ═══════════════════════════════════════
const MAX_HEARTS = 3;
const HEART_REFILL_MS = 30 * 60 * 1000; // 30 minutes
let heartTimerInterval = null;
let heartsEmptyOnBack = null;

function goBackFromHeartsEmpty() {
  const cb = heartsEmptyOnBack;
  heartsEmptyOnBack = null;
  if(cb) cb(); else showHome();
}

function getHeartData() {
  const data = localStorage.getItem('ss_hearts');
  if(!data) return { hearts: MAX_HEARTS, lastLostTime: null };
  try { return JSON.parse(data); } catch(e) { return { hearts: MAX_HEARTS, lastLostTime: null }; }
}

function saveHeartData(hearts, lastLostTime) {
  localStorage.setItem('ss_hearts', JSON.stringify({ hearts, lastLostTime }));
}

function getCurrentHearts() {
  const data = getHeartData();
  if(data.hearts >= MAX_HEARTS) return MAX_HEARTS;
  if(!data.lastLostTime) return data.hearts;

  // Calculate how many hearts have refilled
  const elapsed = Date.now() - data.lastLostTime;
  const refilled = Math.floor(elapsed / HEART_REFILL_MS);
  const current = Math.min(MAX_HEARTS, data.hearts + refilled);

  // Update stored value if hearts refilled
  if(current > data.hearts) {
    const newLastLost = current >= MAX_HEARTS ? null : data.lastLostTime + (refilled * HEART_REFILL_MS);
    saveHeartData(current, newLastLost);
  }
  return current;
}

function loseHeart() {
  const current = getCurrentHearts();
  const newHearts = Math.max(0, current - 1);
  saveHeartData(newHearts, newHearts < MAX_HEARTS ? Date.now() : null);
  return newHearts;
}

function getNextRefillTime() {
  const data = getHeartData();
  if(!data.lastLostTime || data.hearts >= MAX_HEARTS) return null;
  const elapsed = Date.now() - data.lastLostTime;
  const nextRefill = HEART_REFILL_MS - (elapsed % HEART_REFILL_MS);
  return nextRefill;
}

function formatCountdown(ms) {
  const totalSeconds = Math.ceil(ms / 1000);
  const mins = Math.floor(totalSeconds / 60);
  const secs = totalSeconds % 60;
  return `${mins}:${secs.toString().padStart(2,'0')}`;
}

function showHeartsEmptyScreen(onBack) {
  const hearts = getCurrentHearts();
  if(hearts > 0) { onBack(); return; } // Hearts refilled while waiting

  heartsEmptyOnBack = onBack;
  const root = document.getElementById('root');
  showBackBtn(false);

  const nextRefill = getNextRefillTime();
  const heartData = getHeartData();

  root.innerHTML = `
    <div class="hearts-empty-screen">
      <div class="hearts-empty-icon">💔</div>
      <div class="hearts-empty-title">Out of Hearts!</div>
      <div class="hearts-empty-desc">Take a breather — your hearts will refill automatically. Come back soon and keep going!</div>

      <div class="hearts-timer-box">
        <div class="hearts-timer-label">Next heart in</div>
        <div class="hearts-timer-countdown" id="heartCountdown">${nextRefill ? formatCountdown(nextRefill) : '--:--'}</div>
        <div class="heart-refill-bar">
          ${[0,1,2].map(i => {
            const isFull = i < heartData.hearts;
            const isRefilling = i === heartData.hearts;
            return `<div class="heart-refill-slot ${isFull?'full':isRefilling?'refilling':'empty'}"></div>`;
          }).join('')}
        </div>
        <div class="hearts-timer-next" id="heartTimerNext">Full hearts in ${nextRefill ? formatCountdown(nextRefill + (MAX_HEARTS - heartData.hearts - 1) * HEART_REFILL_MS) : '--:--'}</div>
      </div>

      <button class="btn-change-diff" onclick="goBackFromHeartsEmpty()">← Go Back</button>
    </div>`;

  // Start countdown timer
  if(heartTimerInterval) clearInterval(heartTimerInterval);
  heartTimerInterval = setInterval(() => {
    const current = getCurrentHearts();
    const countdown = document.getElementById('heartCountdown');
    const timerNext = document.getElementById('heartTimerNext');
    const next = getNextRefillTime();

    if(current > 0) {
      // Hearts refilled — go back automatically
      clearInterval(heartTimerInterval);
      goBackFromHeartsEmpty();
      return;
    }

    if(countdown && next) countdown.textContent = formatCountdown(next);
    if(timerNext && next) {
      const hd = getHeartData();
      timerNext.textContent = `Full hearts in ${formatCountdown(next + (MAX_HEARTS - hd.hearts - 1) * HEART_REFILL_MS)}`;
    }
  }, 1000);
}

// Check hearts before starting a story round
function checkHeartsBeforeRound(onProceed, onBack) {
  const hearts = getCurrentHearts();
  if(hearts > 0) {
    onProceed(hearts);
  } else {
    showHeartsEmptyScreen(onBack);
  }
}

// ── Topic Progress Storage ──
function getTopicProgress(topicId) {
  try { return JSON.parse(localStorage.getItem(`te_${topicId}`) || '{}'); }
  catch(e) { return {}; }
}

function saveTopicProgress(topicId, roundIdx, score) {
  const prog = getTopicProgress(topicId);
  prog[roundIdx] = score;
  prog.totalScore = Object.values(prog).filter(v => typeof v === 'number' && !isNaN(v)).reduce((a,b)=>a+b,0);
  localStorage.setItem(`te_${topicId}`, JSON.stringify(prog));
}

function getTopicTotalScore(topicId) {
  const prog = getTopicProgress(topicId);
  return prog.totalScore || 0;
}

function getTopicRoundsCompleted(topicId, totalRounds) {
  const prog = getTopicProgress(topicId);
  let count = 0;
  for(let i = 0; i < totalRounds; i++) {
    if(typeof prog[i] === 'number') count++;
  }
  return count;
}

function getTopicStars(topicId, totalRounds) {
  const prog = getTopicProgress(topicId);
  const done = getTopicRoundsCompleted(topicId, totalRounds);
  if(done < totalRounds) return 0;
  const score = prog.totalScore || 0;
  if(score >= 3000) return 3;
  if(score >= 1500) return 2;
  return 1;
}

function renderTopicExplorer() {

function buildBookShell(pageHTML) {
  return '<div class="fg-book">'

    + '</div>';
}

function buildTopicListPage() {
  const entries = TOPICS.map((t, i) => {
    const done = getTopicRoundsCompleted(t.id, t.rounds.length);
    const total = t.rounds.length;
    const stars = getTopicStars(t.id, total);
    const isComplete = done === total;
    const isStarted = done > 0 && !isComplete;
    const numClass = isComplete ? 'fg-num-done' : isStarted ? 'fg-num-active' : 'fg-num-lock';
    const numContent = isComplete ? '✓' : isStarted ? '→' : (i+1);
    const opacity = '';
    let metaHTML = '';
    if(isComplete) {
      const starStr = '★'.repeat(stars)+'☆'.repeat(3-stars);
      metaHTML = '<span class="fg-stars">' + starStr + '</span>'
        + '<span class="fg-pct">' + done + '/' + total + ' rounds</span>'
        + '<span class="fg-stamp fg-stamp-done">Complete</span>';
    } else if(isStarted) {
      metaHTML = '<span class="fg-pct">' + done + '/' + total + ' rounds</span>'
        + '<span class="fg-stamp">In progress</span>';
    } else {
      metaHTML = '<span class="fg-lock-text">Tap to begin</span>';
    }
    return '<div class="fg-path-entry fg-path-tappable" onclick="renderTopicDetail(\''+t.id+'\')">'
      + '<div style="display:flex;align-items:flex-start;gap:0">'
      + '<div class="fg-num ' + numClass + '">' + numContent + '</div>'

      + '<div class="fg-path-title">' + t.title + '</div>'
      + '<div class="fg-path-sub">' + t.subtitle + '</div>'

    + '<div class="fg-page-inner">'
    + '<div class="fg-guide-header">'
    + '<div class="fg-guide-label">Randy\'s Topic Explorer</div>'
    + '<div class="fg-guide-title">Choose a topic</div>'
    + '<div class="fg-guide-sub">Study any topic — Randy guides you through three rounds</div>'
    + '</div>'

function renderTopicDetail(topicId) {
  const t = TOPICS.find(x => x.id === topicId);
  if(!t) return;
  _teCurrentTopic = t;
  const done = getTopicRoundsCompleted(t.id, t.rounds.length);
  const total = t.rounds.length;
  const stars = getTopicStars(t.id, total);
  const totalScore = getTopicTotalScore(t.id);
  const prog = getTopicProgress(t.id);

  const roundsHTML = t.rounds.map((r, i) => {
    const roundScore = prog[i];
    const isDone = typeof roundScore === 'number';
    const isNext = !isDone && i === done;
    const numClass = isDone ? 'fg-ch-done' : isNext ? 'fg-ch-next' : 'fg-ch-lock';
    const numContent = isDone ? '✓' : (i+1);
    const pts = isDone ? '+' + roundScore : (isNext ? '' : '');
    return '<div class="fg-ch-row">'
      + '<div class="fg-ch-n ' + numClass + '">' + numContent + '</div>'
      + '<div class="fg-ch-title">' + r.label + ' — ' + r.desc + '</div>'
      + '<div class="fg-ch-stars" style="color:#c8941a;font-size:11px;">' + pts + '</div>'
      + '</div>';
  }).join('');

  const nextRound = t.rounds[done];
  const btnText = done === 0 ? 'Begin Round 1 →'
    : done >= total ? 'Replay from Start →'
    : 'Continue Round ' + (done+1) + ' →';

  const btnAction = done >= total
    ? 'restartTopic('+JSON.stringify(t.id)+')'
    : 'startTopicRound('+JSON.stringify(t.id)+','+done+')';

  const starDisplay = done >= total ? '★'.repeat(stars)+'☆'.repeat(3-stars) : '—';

  const page = '<div class="fg-page"><div class="fg-page-lines"></div><div class="fg-margin-line"></div>'
    + '<div class="fg-page-inner">'
    + '<div class="fg-back-btn" onclick="renderTopicExplorer()">← back to topics</div>'
    + '<div class="fg-guide-header">'
    + '<div class="fg-guide-title" style="font-size:0.95rem">' + t.title + '</div>'
    + '<div class="fg-guide-sub">' + t.subtitle + '</div>'
    + '</div>'
    + '<div style="background:rgba(139,105,20,0.08);border-left:3px solid #c8941a;border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:14px;font-family:Georgia,serif;font-size:0.8rem;color:#3a2008;line-height:1.7;font-style:italic;">'
    + '"' + t.randyIntro + '"'
    + '</div>'
    + roundsHTML
    + '<div class="journal-stats" style="margin:12px 0">'
    + '<div class="journal-stat"><div class="journal-stat-val">' + totalScore + '</div><div class="journal-stat-label">Score</div></div>'
    + '<div class="journal-stat"><div class="journal-stat-val">' + starDisplay + '</div><div class="journal-stat-label">Rating</div></div>'
    + '<div class="journal-stat"><div class="journal-stat-val">' + done + '/' + total + '</div><div class="journal-stat-label">Rounds</div></div>'
    + '</div>'
    + '<button class="fg-begin-btn" onclick="' + btnAction + '">' + btnText + '</button>'
    + '<div class="fg-page-num">p. 2</div>'
    + '</div></div>';

  document.getElementById('root').innerHTML = buildBookShell(page);
}

function restartTopic(topicId) {
  localStorage.removeItem('te_' + topicId);
  startTopicRound(topicId, 0);
}

function startTopicRound(topicId, roundIdx) {
  const t = TOPICS.find(x => x.id === topicId);
  if(!t) return;
  _teCurrentTopic = t;
  _teCurrentRound = roundIdx;
  _teSessionScore = 0;

  const round = t.rounds[roundIdx];
  if(round.type === 'trivia') renderTopicTrivia(t, roundIdx).catch(e => { console.error(e); finishTopicRound(t.id, roundIdx, 0); });
  else if(round.type === 'fillin') renderTopicFillin(t, roundIdx);
  else if(round.type === 'scout') renderTopicScout(t, roundIdx);
}

async function finishTopicRound(topicId, roundIdx, score) {
  saveTopicProgress(topicId, roundIdx, score);
  const t = TOPICS.find(x => x.id === topicId);

  const stars = getTopicStars(topicId, t.rounds.length);

  const closingLines = [

  const closing = isComplete

    : '"' + closingLines[roundIdx % closingLines.length] + '" — Randy';

  const btnAction = isComplete ? 'renderTopicExplorer()' : 'startTopicRound('+JSON.stringify(topicId)+','+nextRound+')';

  );

  // Trigger streak

}

// ── TRIVIA ROUND ──
async function renderTopicTrivia(topic, roundIdx) {
  const root = document.getElementById('root');
  root.innerHTML = '<div style="text-align:center;padding:40px 16px"><div class="spinner"></div><div style="margin-top:12px;color:var(--text-muted);font-size:0.85rem">Loading questions...</div></div>';

  // Try Supabase first, fall back to local
  let questions = [];
  try {
    const rows = await sbFetch(`bible_trivia_questions?topic=eq.${encodeURIComponent(topic.id)}&select=*&limit=20`);
    if(rows && rows.length >= 3) {
      questions = shuffle(rows).slice(0, 5).map(r => ({
        q: r.question,
        a: r.answer,
        choices: typeof r.choices === 'string' ? JSON.parse(r.choices) : r.choices,
        diff: r.difficulty,
        ref: r.reference,
      }));
    }
  } catch(e) {
    console.warn('Supabase trivia fetch failed, using local:', e.message);
  }

  // Fall back to local topic trivia
  if(questions.length < 3 && topic.trivia && topic.trivia.length > 0) {
    questions = shuffle([...topic.trivia]).slice(0, 5);
  }

  // Last resort — pull from DAILY_TRIVIA_BANK by bucket
  if(questions.length < 3) {
    const bucket = topic.bucket || 'general';
    const pool = DAILY_TRIVIA_BANK.filter(q => q.bucket === bucket || bucket === 'general');
    questions = shuffle(pool).slice(0, 5).map(q => ({
      q: q.q, a: q.a, choices: q.choices, diff: q.diff, ref: q.ref
    }));
  }

  if(questions.length === 0) {
    finishTopicRound(topic.id, roundIdx, 0);
    return;
  }

  let qIdx = 0, score = 0, correct = 0;

  function renderQ() {
    if(qIdx >= questions.length) {
      finishTopicRound(topic.id, roundIdx, score);
      return;
    }
    const q = questions[qIdx];
    const choices = shuffle([...q.choices]);
    root.innerHTML = '<div style="max-width:560px;width:100%;margin:0 auto">'
      + '<div style="text-align:center;margin-bottom:12px;">'
      + '<div style="font-size:0.72rem;font-weight:700;color:#A78BFA;text-transform:uppercase;letter-spacing:0.1em;">📖 ' + topic.title + ' — Trivia</div>'
      + '<div style="font-size:0.7rem;color:var(--text-muted);margin-top:3px;">Question ' + (qIdx+1) + ' of ' + questions.length + ' · Score: ' + score + '</div>'
      + '<div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">'
      + Array.from({length:questions.length},(_,i)=>'<div style="width:10px;height:10px;border-radius:50%;background:' + (i<qIdx?'#5aaa30':i===qIdx?'#f4b942':'rgba(139,105,20,0.2)') + '"></div>').join('')
      + '</div></div>'
      + '<div class="card" style="max-width:560px;width:100%">'
      + '<div style="font-size:0.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">' + (q.diff||'').toUpperCase() + ' · ' + (q.ref||'') + '</div>'
      + '<div style="font-size:1rem;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:18px;">' + q.q + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + choices.map(c => '<button class="ref-option" data-ans="' + c + '">' + c + '</button>').join('')
      + '</div>'
      + '<div class="feedback" id="trivFB"></div>'
      + '</div></div>';

    document.querySelectorAll('.ref-option').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.ref-option').forEach(b => b.disabled = true);
        const isCorrect = btn.dataset.ans === q.a;
        btn.classList.add(isCorrect ? 'correct' : 'wrong');
        const correctBtn = document.querySelector('[data-ans="' + q.a + '"]');
        if(!isCorrect && correctBtn) correctBtn.classList.add('correct');
        const pts = (q.diff||'').includes('easy') ? 200 : (q.diff||'').includes('hard') ? 500 : 350;
        if(isCorrect) { score += pts; correct++; document.getElementById('trivFB').className='feedback correct'; document.getElementById('trivFB').textContent='✓ Correct! +'+pts; }
        else { document.getElementById('trivFB').className='feedback wrong'; document.getElementById('trivFB').textContent='✗ '+q.a; }
        setTimeout(() => { qIdx++; renderQ(); }, 1200);
      };
    });
  }
  renderQ();
}

function renderTopicFillin(topic, roundIdx) {
  const verses = topic.fillVerses || [];
  const root = document.getElementById('root');
  let vIdx = 0, score = 0;

  function renderV() {
    if(vIdx >= verses.length) {
      finishTopicRound(topic.id, roundIdx, score);
      return;
    }
    const v = verses[vIdx];
    root.innerHTML = '<div style="max-width:560px;width:100%;margin:0 auto">'
      + '<div style="text-align:center;margin-bottom:12px;">'
      + '<div style="font-size:0.72rem;font-weight:700;color:#60A5FA;text-transform:uppercase;letter-spacing:0.1em;">✏️ ' + topic.title + ' — Fill in the Blank</div>'
      + '<div style="font-size:0.7rem;color:var(--text-muted);margin-top:3px;">Verse ' + (vIdx+1) + ' of ' + verses.length + ' · Score: ' + score + '</div>'
      + '<div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">'
      + Array.from({length:verses.length},(_,i)=>'<div style="width:10px;height:10px;border-radius:50%;background:' + (i<vIdx?'#5aaa30':i===vIdx?'#60A5FA':'rgba(139,105,20,0.2)') + '"></div>').join('')
      + '</div></div>'
      + '<div class="card" style="max-width:560px;width:100%">'
      + '<div style="font-size:0.75rem;font-weight:700;color:var(--text-muted);margin-bottom:10px;">' + v.ref + '</div>'
      + '<div style="font-size:1rem;color:var(--text);line-height:1.7;margin-bottom:18px;font-style:italic;">"' + v.text + '"</div>'
      + '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;">Hint: ' + v.hint + '</div>'
      + '<input type="text" id="fillInput" placeholder="Type the missing word..." style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;background:var(--surface);color:var(--text);outline:none;">'
      + '<div class="feedback" id="fillFB" style="margin-top:10px;"></div>'
      + '<div style="display:flex;gap:8px;margin-top:12px;">'
      + '<button id="fillBtn" class="btn" style="flex:1;padding:12px;" onclick="checkTopicFillin()">Check Answer</button>'
      + '<button id="skipBtn" class="btn" style="padding:12px 16px;opacity:0.6;" onclick="skipTopicFillin()">Skip</button>'
      + '</div>'
      + '</div></div>';

    document.getElementById('fillInput').addEventListener('keydown', e => { if(e.key==='Enter') checkTopicFillin(); });
    document.getElementById('fillInput').focus();

    window._teCurrentVerse = v;
    window._teFillinScore = () => score;
    window._teAddFillinScore = (pts) => { score += pts; };
    window._teNextVerse = () => { vIdx++; renderV(); };
  }
  renderV();
}

function checkTopicFillin() {
  const input = document.getElementById('fillInput');
  const btn = document.getElementById('fillBtn');
  const skipBtn = document.getElementById('skipBtn');
  const fb = document.getElementById('fillFB');
  const v = window._teCurrentVerse;
  if(!input || !v) return;
  btn.disabled = true;
  if(skipBtn) skipBtn.disabled = true;
  input.disabled = true;
  const userAns = input.value.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'');
  const correct = v.answer.toLowerCase().replace(/[^a-z0-9 ]/g,'');
  // Allow partial match — user answer contains the key word
  const isCorrect = userAns === correct
    || userAns.includes(correct)
    || correct.includes(userAns)
    || correct.split(' ').some(w => w.length > 3 && userAns.includes(w));
  const pts = 300;
  if(isCorrect) {
    window._teAddFillinScore(pts);
    fb.className = 'feedback correct';
    fb.textContent = '✓ Correct! +' + pts;
  } else {
    fb.className = 'feedback wrong';
    fb.textContent = '✗ The answer was: ' + v.answer;
  }
  setTimeout(() => window._teNextVerse(), 1400);
}

function skipTopicFillin() {
  const btn = document.getElementById('fillBtn');
  const skipBtn = document.getElementById('skipBtn');
  const fb = document.getElementById('fillFB');
  const input = document.getElementById('fillInput');
  const v = window._teCurrentVerse;
  if(!v) return;
  if(btn) btn.disabled = true;
  if(skipBtn) skipBtn.disabled = true;
  if(input) input.disabled = true;
  fb.className = 'feedback wrong';
  fb.textContent = '✗ The answer was: ' + v.answer;
  setTimeout(() => window._teNextVerse(), 1400);
}

async function fetchTopicScoutVerse(topic) {
  const root = document.getElementById('root');
  root.innerHTML = '<div style="text-align:center;padding:40px 16px"><div class="spinner"></div><div style="margin-top:12px;color:var(--text-muted);font-size:0.85rem">Loading verse...</div></div>';
  try {
    const books = topic.scoutBooks || ['Genesis'];
    const book = books[Math.floor(Math.random()*books.length)];
    const diffs = ['easy','medium'];
    const diff = diffs[Math.floor(Math.random()*diffs.length)];
    const total = DIFF_COUNTS[TRANSLATION][diff] || 100;
    const offset = Math.floor(Math.random()*Math.min(total,200));
    const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&book=eq.${encodeURIComponent(book)}&difficulty=eq.${diff}&select=*&limit=1&offset=${offset}`);
    if(!rows || !rows.length) throw new Error('No verse found');
    const row = rows[0];
    _teScoutVerse = { t:row.testament, book:row.book, ch:row.chapter, v:row.verse, text:row.text };
    _teScoutPhase = 0;
    _teScoutVerseScore = 0;
    renderTopicScoutCard(topic);
  } catch(e) {
    // Fallback to endless verse
    try {
      _teScoutVerse = await fetchEndlessVerse();
      _teScoutPhase = 0;
      _teScoutVerseScore = 0;
      renderTopicScoutCard(topic);
    } catch(e2) {
      root.innerHTML = '<div class="card" style="text-align:center;padding:24px"><div style="color:var(--text-muted)">Could not load verse. Check connection.</div><button class="btn" style="margin-top:12px" onclick="renderTopicDetail(_teScoutTopicId)">Back</button></div>';
    }
  }
}

function renderTopicScoutCard(topic) {
  const root = document.getElementById('root');
  const v = _teScoutVerse;
  const versesLeft = 3 - _teScoutVersesFound;

  root.innerHTML = '<div style="max-width:560px;width:100%;margin:0 auto">'
    + '<div style="text-align:center;margin-bottom:12px;">'
    + '<div style="font-size:0.72rem;font-weight:700;color:#34D399;text-transform:uppercase;letter-spacing:0.1em;">🔍 ' + topic.title + ' — Scripture Scout</div>'
    + '<div style="font-size:0.7rem;color:var(--text-muted);margin-top:3px;">Verse ' + (_teScoutVersesFound+1) + ' of 3 · Score: ' + _teScoutScore + '</div>'
    + '<div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">'
    + [0,1,2].map(i => '<div style="width:10px;height:10px;border-radius:50%;background:' + (i<_teScoutVersesFound?'#5aaa30':i===_teScoutVersesFound?'#34D399':'rgba(139,105,20,0.2)') + '"></div>').join('')
    + '</div></div>'
    + '<div class="card">'
    + '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:6px;text-align:center;">Which book and where is this verse?</div>'
    + '<div style="font-size:1rem;font-style:italic;color:var(--text);line-height:1.6;margin-bottom:16px;text-align:center;">"' + v.text + '"</div>'
    + '<div id="teScoutPhaseArea"></div>'
    + '<div class="feedback" id="teScoutFB"></div>'
    + '</div></div>';

  renderTopicScoutPhase(topic);
}

function renderTopicScoutPhase(topic) {
  const area = document.getElementById('teScoutPhaseArea');
  const fb = document.getElementById('teScoutFB');
  if(!area) return;
  const v = _teScoutVerse;

  if(_teScoutPhase === 0) {
    // Testament
    area.innerHTML = '<div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:10px;">Which Testament?</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + '<button class="ref-option" data-ans="OT">Old Testament</button>'
      + '<button class="ref-option" data-ans="NT">New Testament</button>'
      + '</div>';
    area.querySelectorAll('.ref-option').forEach(btn => {
      btn.onclick = () => {
        const correct = btn.dataset.ans === v.t;
        area.querySelectorAll('.ref-option').forEach(b => b.disabled = true);
        btn.classList.add(correct ? 'correct' : 'wrong');
        if(!correct) area.querySelector('[data-ans="'+v.t+'"]').classList.add('correct');
        if(correct) { _teScoutVerseScore += 100; fb.className='feedback correct'; fb.textContent='✓ Correct! +100'; }
        else { fb.className='feedback wrong'; fb.textContent='✗ ' + (v.t==='OT'?'Old Testament':'New Testament'); }
        setTimeout(() => { _teScoutPhase=1; fb.textContent=''; renderTopicScoutPhase(topic); }, 1000);
      };
    });

  } else if(_teScoutPhase === 1) {
    // Book
    const allBooks = (v.t==='OT'?OT_BOOKS:NT_BOOKS).map(b=>b[0]);
    const wrongBooks = shuffle(allBooks.filter(b=>b!==v.book)).slice(0,5);
    const choices = shuffle([v.book, ...wrongBooks]);
    area.innerHTML = '<div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:10px;">Which Book?</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + choices.map(b => '<button class="ref-option" data-ans="'+b+'">'+b+'</button>').join('')
      + '</div>';
    area.querySelectorAll('.ref-option').forEach(btn => {
      btn.onclick = () => {
        const correct = btn.dataset.ans === v.book;
        area.querySelectorAll('.ref-option').forEach(b => b.disabled = true);
        btn.classList.add(correct ? 'correct' : 'wrong');
        const cb = area.querySelector('[data-ans="'+v.book+'"]');
        if(!correct && cb) cb.classList.add('correct');
        if(correct) { _teScoutVerseScore += 200; fb.className='feedback correct'; fb.textContent='✓ Correct! +200'; }
        else { fb.className='feedback wrong'; fb.textContent='✗ ' + v.book; }
        setTimeout(() => { _teScoutPhase=2; fb.textContent=''; renderTopicScoutPhase(topic); }, 1000);
      };
    });

  } else if(_teScoutPhase === 2) {
    // Chapter
    const maxCh = (v.t==='OT'?OT_BOOKS:NT_BOOKS).find(b=>b[0]===v.book)?.[1] || 30;
    const wrongs = [];
    while(wrongs.length < 3) {
      const c = Math.max(1, Math.min(maxCh, v.ch + Math.floor(Math.random()*6)-3));
      if(c !== v.ch && !wrongs.includes(c)) wrongs.push(c);
    }
    const choices = shuffle([v.ch, ...wrongs]);
    area.innerHTML = '<div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:10px;">Which Chapter?</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + choices.map(c => '<button class="ref-option" data-ans="'+c+'">Chapter '+c+'</button>').join('')
      + '</div>';
    area.querySelectorAll('.ref-option').forEach(btn => {
      btn.onclick = () => {
        const correct = parseInt(btn.dataset.ans) === v.ch;
        area.querySelectorAll('.ref-option').forEach(b => b.disabled = true);
        btn.classList.add(correct ? 'correct' : 'wrong');
        const cb = area.querySelector('[data-ans="'+v.ch+'"]');
        if(!correct && cb) cb.classList.add('correct');
        if(correct) { _teScoutVerseScore += 300; fb.className='feedback correct'; fb.textContent='✓ Correct! +300'; }
        else { fb.className='feedback wrong'; fb.textContent='✗ Chapter '+v.ch; }
        setTimeout(() => { _teScoutPhase=3; fb.textContent=''; renderTopicScoutPhase(topic); }, 1000);
      };
    });

  } else if(_teScoutPhase === 3) {
    // Verse number
    const wrongs = [];
    while(wrongs.length < 3) {
      const vn = Math.max(1, v.v + Math.floor(Math.random()*8)-4);
      if(vn !== v.v && !wrongs.includes(vn)) wrongs.push(vn);
    }
    const choices = shuffle([v.v, ...wrongs]);
    area.innerHTML = '<div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:10px;">Which Verse?</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + choices.map(vn => '<button class="ref-option" data-ans="'+vn+'">Verse '+vn+'</button>').join('')
      + '</div>';
    area.querySelectorAll('.ref-option').forEach(btn => {
      btn.onclick = () => {
        const correct = parseInt(btn.dataset.ans) === v.v;
        area.querySelectorAll('.ref-option').forEach(b => b.disabled = true);
        btn.classList.add(correct ? 'correct' : 'wrong');
        const cb = area.querySelector('[data-ans="'+v.v+'"]');
        if(!correct && cb) cb.classList.add('correct');
        if(correct) { _teScoutVerseScore += 400; fb.className='feedback correct'; fb.textContent='✓ Correct! +400 — Full scout! ' + v.book+' '+v.ch+':'+v.v; }
        else { fb.className='feedback wrong'; fb.textContent='✗ Verse '+v.v; }
        _teScoutScore += _teScoutVerseScore;
        _teScoutVersesFound++;
        setTimeout(() => {
          if(_teScoutVersesFound >= 3) {
            finishTopicRound(_teScoutTopicId, _teScoutRoundIdx, _teScoutScore);
          } else {
            fetchTopicScoutVerse(topic);
          }
        }, 1400);
      };
    });
  }
}

// Track recently seen trivia question IDs to avoid repeats
const _seenTriviaIds = { easy: [], medium: [], hard: [], endless: [] };
const MAX_SEEN = 30; // remember last 30 questions per difficulty

async function startTrivia(diff) {
  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading questions…</div></div>`;

  const isEndless = diff === 'endless';
  let questions = [];

  try {
    // Fetch a larger pool then pick randomly client-side
    // This avoids relying on Supabase order=random() which may not work
    const dbDiff = isEndless ? '' : `&difficulty=eq.${diff}`;
    const limit = isEndless ? 120 : 60;
    const rows = await sbFetch(`bible_trivia_questions?select=*${dbDiff}&limit=${limit}`);

    if(rows && rows.length >= 5) {
      // Filter out recently seen questions
      const seenKey = isEndless ? 'endless' : diff;
      const seen = _seenTriviaIds[seenKey] || [];
      let pool = rows.filter(r => !seen.includes(r.id));

      // If we've seen most questions, reset the seen list
      if(pool.length < 10) {
        _seenTriviaIds[seenKey] = [];
        pool = rows;
      }

      // Shuffle and pick
      const shuffled = shuffleTrivia(pool);
      const picked = shuffled.slice(0, isEndless ? shuffled.length : 10);

      // Remember these IDs
      const newSeen = [...seen, ...picked.map(r => r.id)].slice(-MAX_SEEN);
      _seenTriviaIds[seenKey] = newSeen;

      questions = picked.map(r => ({
        q: r.question, a: r.answer,
        choices: typeof r.choices === 'string' ? JSON.parse(r.choices) : r.choices,
        diff: r.difficulty, ref: r.reference || '',
        id: r.id
      }));
    }
  } catch(e) { console.log('DB trivia fetch failed, using local:', e); }

  // Fallback to local questions if DB fails or not enough
  if(questions.length < 5) {
    const seenKey = isEndless ? 'endless' : diff;
    const seen = _seenTriviaIds[seenKey] || [];
    const localPool = isEndless ? BIBLE_TRIVIA : BIBLE_TRIVIA.filter(q => q.diff === diff);

    // Filter seen, reset if needed
    let available = localPool.filter((q, i) => !seen.includes(`local_${i}`));
    if(available.length < 5) {
      _seenTriviaIds[seenKey] = [];
      available = localPool;
    }

    const shuffled = shuffleTrivia(available);
    const picked = shuffled.slice(0, isEndless ? shuffled.length : 10);
    const indices = picked.map(q => `local_${localPool.indexOf(q)}`);
    _seenTriviaIds[seenKey] = [...seen, ...indices].slice(-MAX_SEEN);
    questions = picked;
  }

  triviaSession = {
    difficulty: diff,
    questions,
    current: 0,
    score: 0,
    correct: 0,
    wrong: 0,
    startTime: Date.now(),
    mode: isEndless ? 'endless' : 'normal',
    _scoreSubmitted: false,
    _questionStart: Date.now()
  };
  renderTriviaQuestion();
}

function shuffleTrivia(arr) {
  const a = [...arr];
  for(let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function checkTriviaAnswer(btn, chosen, pts) {
  const s = triviaSession;
  const q = s.questions[s.current];
  const correct = chosen === q.a;
  document.querySelectorAll('#triviaChoices button').forEach(b => {
    b.disabled = true;
    const bText = b.textContent.trim();
    if(bText === q.a){ b.style.background='rgba(45,110,62,0.2)';b.style.borderColor='#2d6e3e';b.style.color='#2d6e3e'; }
    else if(bText === chosen && !correct){ b.style.background='rgba(200,64,26,0.2)';b.style.borderColor='#c8401a';b.style.color='#c8401a'; }
    else { b.style.opacity='0.4'; }
  });
  if(correct){
    const elapsed=(Date.now()-s._questionStart)/1000;
    const speedBonus=Math.max(0,Math.floor((5-Math.min(elapsed,5))/5*50));
    s.score+=pts+speedBonus; s.correct++;
    playCorrect(); showRandyReaction('happy');
  } else {
    s.wrong++; playWrong(); showRandyReaction('sad');
    if(s.mode==='endless'){setTimeout(()=>renderTriviaComplete(),1500);return;}
  }
  s.current++;
  setTimeout(()=>renderTriviaQuestion(),1200);
}

// ENDLESS MEMORY TRAIL
let memoryEndlessState = { streak: 0, missCount: 0, score: 0 };

async function startMemoryEndless() {
  memoryEndlessState = { streak: 0, missCount: 0, score: 0 };
  flashcardSession.filter.difficulty = 'hard';
  flashcardSession.verses = [];
  flashcardSession.current = 0;
  flashcardSession.knew = 0;
  flashcardSession.almost = 0;
  flashcardSession.didnt = 0;

  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading Endless Memory Trail…</div></div>`;

  // Pre-fetch a batch of verses
  const total = DIFF_COUNTS[TRANSLATION]['hard'];
  const usedVerseIdsEM = new Set();
  let safetyEM = 0;
  while(flashcardSession.verses.length < 20 && safetyEM < 200) {
    safetyEM++;
    const offset = Math.floor(Math.random() * total);
    const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&difficulty=eq.hard&select=*&limit=1&offset=${offset}`);
    if(rows.length && !usedVerseIdsEM.has(rows[0].id)) {
      usedVerseIdsEM.add(rows[0].id);
      flashcardSession.verses.push(rows[0]);
    }
  }

  renderMemoryEndlessCard();
}

function renderMemoryEndlessCard() {
  const s = flashcardSession;
  const es = memoryEndlessState;
  if(s.current >= s.verses.length) {
    // Fetch more verses
    startMemoryEndless();
    return;
  }

  const v = s.verses[s.current];
  currentHints = null; hintsRevealed = 0;
  const heartDisplay = '💔'.repeat(es.missCount) + '❤️'.repeat(3 - es.missCount);

  document.getElementById('root').innerHTML = `
    <div class="endless-hud">
      <div class="endless-hud-item"><strong id="emScoreDisplay">${es.score.toLocaleString()}</strong> pts</div>
      <div class="endless-hud-item"><strong id="emStreakDisplay">${es.streak}</strong> streak</div>
      <div class="endless-hud-item">${heartDisplay}</div>
      <div class="endless-hud-item"><span class="endless-badge"><img src="icons/diff-endless.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Memory</span></div>
    </div>
    <div class="card" id="card">
      <div class="flashcard-label">Can you recall this verse?</div>
      <div class="flashcard-reference">${v.book} ${v.chapter}:${v.verse}</div>
      <div class="flashcard-book">${v.testament === 'OT' ? '<img src="icons/testament-ot.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Old Testament' : '<img src="icons/testament-nt.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> New Testament'}</div>

      <hr class="divider" style="margin:14px 0;"/>
      <div id="memoryFlipArea">
        <button class="btn-next" id="memoryFlipBtn">Flip to see verse →</button>
      </div>
    </div>`;

  document.getElementById('memoryFlipBtn').onclick = () => {
    document.getElementById('memoryFlipArea').innerHTML = `
      <div class="flashcard-verse" style="margin-bottom:14px;">"${v.text}"</div>
      <div class="rating-btns">
        <button class="rating-btn rating-didnt" onclick="rateMemoryEndless('didnt_know')"><span class="rating-icon">😬</span>Didn't Know</button>
        <button class="rating-btn rating-almost" onclick="rateMemoryEndless('almost')"><span class="rating-icon">🤔</span>Almost</button>
        <button class="rating-btn rating-knew" onclick="rateMemoryEndless('knew_it')"><span class="rating-icon">✅</span>Knew It!</button>
      </div>`;
  };
}

async function rateMemoryEndless(rating) {
  const es = memoryEndlessState;
  if(rating === 'knew_it') {
    es.streak++;
    es.score += 300 + (es.streak * 50);
  } else if(rating === 'almost') {
    es.score += 100;
  } else {
    es.missCount++;
    es.streak = 0;
  }

  if(es.missCount >= 3) {
    // Game over
    await updateStreak();
    document.getElementById('root').innerHTML = `
      <div class="card" style="max-width:560px;width:100%;text-align:center;padding:32px 24px;">
        <div class="verse-label"><img src="icons/diff-endless.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Endless Memory Trail</div>
        <div class="endless-final">${es.score.toLocaleString()}</div>
        <div class="endless-streak-display">Run ended after 3 misses</div>
        <button class="btn-next" onclick="startMemoryEndless()">Play Again</button>
        <button class="btn-change-diff" style="margin-top:8px;" onclick="renderFlashcardSetup()">← Back</button>
      </div>`;
    return;
  }

  flashcardSession.current++;
  renderMemoryEndlessCard();
}

async function startMIAEndless() {
  miaEndlessState = { streak: 0, score: 0 };
  fitbSession.difficulty = 'hard';
  fitbSession.verses = [];
  fitbSession.current = 0;
  fitbSession.score = 0;
  fitbSession.correct = 0;

  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading Endless MIA…</div></div>`;

  // Fetch one verse at a time in endless mode
  await fetchNextMIAVerse();
}

async function fetchNextMIAVerse() {
  const total = DIFF_COUNTS[TRANSLATION]['medium'];
  const offset = Math.floor(Math.random() * total);
  const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&difficulty=eq.medium&select=*&limit=1&offset=${offset}`);
  if(rows.length) {
    fitbSession.verses = [rows[0]];
    fitbSession.current = 0;
    renderMIAEndlessCard();
  }
}

function renderMIAEndlessCard() {
  const es = miaEndlessState;
  const v = fitbSession.verses[0];
  if(!v) return;

  const blanks = getBlankWords(v.text, 'hard');
  fitbSession.blanks = blanks;
  fitbSession.currentBlankIndex = 0;
  fitbSession.options = blanks.map(b => generateOptions(b.word, v.text.split(' ')));
  const blankHtml = buildBlankVerse(v.text, blanks, 0);

  document.getElementById('root').innerHTML = `
    <div class="endless-hud">
      <div class="endless-hud-item"><strong>${es.score.toLocaleString()}</strong> pts</div>
      <div class="endless-hud-item"><strong>${es.streak}</strong> streak</div>
      <div class="endless-hud-item"><span class="multiplier">×${(1+es.streak*0.1).toFixed(1)}</span> mult</div>
      <div class="endless-hud-item"><span class="endless-badge"><img src="icons/diff-endless.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> MIA</span></div>
    </div>
    <div class="card" style="max-width:560px;width:100%;">
      <div class="verse-label">✏️ Endless Missing in Action</div>
      <div style="font-size:0.78rem;font-weight:700;color:#A78BFA;margin-bottom:10px;">📖 ${v.book} ${v.chapter}:${v.verse}</div>
      <div class="blank-verse" id="blankVerse">${blankHtml}</div>
      <div id="blankInputArea"></div>
      <div class="feedback" id="fitbFeedback"></div>
    </div>`;

  // Override checkBlankAnswer to end run on wrong
  renderBlankInputEndless();
}

function renderBlankInputEndless() {
  const s = fitbSession;
  const es = miaEndlessState;
  const area = document.getElementById('blankInputArea');
  if(!area) return;

  const verseEl = document.getElementById('blankVerse');
  if(verseEl) verseEl.innerHTML = buildBlankVerse(s.verses[0].text, s.blanks, s.currentBlankIndex);

  if(s.currentBlankIndex >= s.blanks.length) {
    // Verse complete!
    es.streak++;
    es.score += Math.round(500 * (1 + es.streak * 0.1));
    area.innerHTML = `
      <div class="ref-box">📖 <strong>${s.verses[0].book} ${s.verses[0].chapter}:${s.verses[0].verse}</strong></div>
      <div class="bank-bar">
        <button class="btn-next" id="miaNextBtn">Keep Going →</button>
        <button class="btn-bank" id="miaBankBtn">🏦 Bank Score</button>
      </div>`;
    document.getElementById('miaNextBtn').onclick = fetchNextMIAVerse;
    document.getElementById('miaBankBtn').onclick = endMIAEndless;
    return;
  }

  const blank = s.blanks[s.currentBlankIndex];
  const options = s.options[s.currentBlankIndex];

  area.innerHTML = `
    <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;font-weight:600;">Tap blank <strong style="color:var(--teal);">${s.currentBlankIndex+1} of ${s.blanks.length}</strong> — one wrong ends the run!</div>
    <div class="blank-options">
      ${options.map(o=>`<button class="blank-option" data-word="${o}">${o}</button>`).join('')}
    </div>`;

  area.querySelectorAll('.blank-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const isCorrect = btn.dataset.word.toLowerCase() === blank.word.toLowerCase();
      document.querySelectorAll('.blank-option').forEach(b => { b.disabled = true; });
      const blankSpan = document.querySelector(`.blank-word[data-index="${blank.index}"]`);

      if(isCorrect) {
        btn.classList.add('correct');
        if(blankSpan) { blankSpan.textContent = blank.word; blankSpan.classList.add('revealed'); }
        fitbSession.currentBlankIndex++;
        setTimeout(() => renderBlankInputEndless(), 600);
      } else {
        btn.classList.add('wrong');
        if(blankSpan) { blankSpan.textContent = blank.word; blankSpan.classList.add('wrong'); }
        setTimeout(() => endMIAEndless(true), 1500);
      }
    });
  });
}

async function endMIAEndless(lost) {
  const es = miaEndlessState;
  await updateStreak();
  document.getElementById('root').innerHTML = `
    <div class="card" style="max-width:560px;width:100%;text-align:center;padding:32px 24px;">
      <div class="verse-label"><img src="icons/diff-endless.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Endless Missing in Action</div>
      <div style="font-size:1rem;color:var(--text-muted);margin-bottom:8px;">${lost ? '💀 Run Ended!' : '🏦 Score Banked!'}</div>
      <div class="endless-final">${es.score.toLocaleString()}</div>
      <div class="endless-streak-display">${es.streak} verse${es.streak===1?'':'s'} completed</div>
      <button class="btn-next" onclick="startMIAEndless()">Play Again</button>
      <button class="btn-change-diff" style="margin-top:8px;" onclick="renderFillBlankSetup()">← Back</button>
    </div>`;
}

let trackEndlessState = { streak: 0, score: 0, multiplier: 1 };

  rcSession.difficulty = 'hard';
  rcSession.verses = [];
  rcSession.current = 0;
  rcSession.score = 0;
  rcSession.correct = 0;

  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading Endless Track It Down…</div></div>`;
  await fetchNextTrackVerse();
}

async function fetchNextTrackVerse() {
  const total = DIFF_COUNTS[TRANSLATION]['hard'];
  const offset = Math.floor(Math.random() * total);
  const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&difficulty=eq.hard&select=*&limit=1&offset=${offset}`);
  if(rows.length) {
    rcSession.verses = [rows[0]];
    rcSession.current = 0;
    renderTrackEndlessCard();
  }
}

async function renderTrackEndlessCard() {
  const es = trackEndlessState;
  const v = rcSession.verses[0];
  if(!v) return;

  const pts = Math.round(500 * es.multiplier);
  const options = await generateRefOptions(v, 'hard');
  const letters = ['A','B','C','D'];

  document.getElementById('root').innerHTML = `
    <div class="endless-hud">
      <div class="endless-hud-item"><strong>${es.score.toLocaleString()}</strong> pts</div>
      <div class="endless-hud-item"><span class="multiplier">×${es.multiplier.toFixed(1)}</span> mult</div>
      <div class="endless-hud-item"><strong>${es.streak}</strong> streak</div>
      <div class="endless-hud-item"><span class="endless-badge"><img src="icons/diff-endless.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Track</span></div>
    </div>
    <div class="card" style="max-width:560px;width:100%;">
      <div class="verse-label"><img src="icons/target.svg" width="18" height="18" style="vertical-align:-4px;object-fit:contain;" alt=""> Endless Track It Down <span class="pts-hint">(+${pts} pts)</span></div>
      <div class="verse-text" style="margin-bottom:16px;">"${v.text}"</div>
      <hr class="divider"/>
      <div class="ref-options" id="trackRefOptions">
        ${options.map((opt,i) => `
          <button class="ref-option" data-ref="${opt}">
            <span class="ref-option-letter">${letters[i]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="feedback" id="trackFeedback"></div>
    </div>`;

  const correctRef = `${v.book} ${v.chapter}`;
  document.querySelectorAll('.ref-option').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ref-option').forEach(b => { b.disabled = true; });
      const isCorrect = btn.dataset.ref === correctRef;
      document.querySelectorAll('.ref-option').forEach(b => {
        if(b.dataset.ref === correctRef) b.classList.add(isCorrect && b===btn ? 'correct' : 'reveal');
        if(b===btn && !isCorrect) b.classList.add('wrong');
      });

      const fb = document.getElementById('trackFeedback');
      if(isCorrect) {
        es.streak++;
        es.score += pts;
        es.multiplier = parseFloat((1 + es.streak * 0.2).toFixed(1));
        if(fb) { fb.className='feedback correct'; fb.innerHTML=`✓ Correct! <span class="points-pop">+${pts}</span>`; }
        setTimeout(() => {
          const area = document.getElementById('trackRefOptions');
          if(area) area.innerHTML = `
            <div class="ref-box">📖 <strong>${v.book} ${v.chapter}:${v.verse}</strong></div>
            <div class="bank-bar">
              <button class="btn-next" id="trackNextBtn">Keep Going →</button>
              <button class="btn-bank" id="trackBankBtn">🏦 Bank Score</button>
            </div>`;
          document.getElementById('trackNextBtn').onclick = fetchNextTrackVerse;
          document.getElementById('trackBankBtn').onclick = () => endTrackEndless(false);
        }, 800);
      } else {
        if(fb) { fb.className='feedback wrong'; fb.innerHTML=`✗ It was <strong>${correctRef}</strong>. Run ended!`; }
        setTimeout(() => endTrackEndless(true), 1800);
      }
    });
  });
}

async function endTrackEndless(lost) {
  const es = trackEndlessState;
  await updateStreak();
  document.getElementById('root').innerHTML = `
    <div class="card" style="max-width:560px;width:100%;text-align:center;padding:32px 24px;">
      <div class="verse-label"><img src="icons/diff-endless.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Endless Track It Down</div>
      <div style="font-size:1rem;color:var(--text-muted);margin-bottom:8px;">${lost ? '💀 Run Ended!' : '🏦 Score Banked!'}</div>

}

async function sendChallenge(friendId, friendUsername, game, difficulty, score, verse) {
  if(!currentUser) { showStreakToast('Sign in to challenge friends!'); return; }
  try {
    const body = {
      challenger_id: currentUser.id,
      opponent_id: friendId,
      game,
      difficulty,
      challenger_score: score,
      challenger_name: currentUsername || playerName,
      verse_id: verse?.id || null,
      verse_book: verse?.book || null,
      verse_chapter: verse?.chapter || null,
      verse_verse: verse?.verse || null
    };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/challenges`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=representation' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    // Send notification
    const gameNames = { scout:'Scripture Scout', trivia:'Bible Trivia', mia:'Missing in Action', track:'Track It Down' };
    await createNotification(friendId, 'challenge',
      `⚔️ ${currentUsername} challenged you to beat ${score.toLocaleString()} pts on ${gameNames[game]} ${difficulty}! You have 24 hours.`,
      { challenge_id: data[0]?.id, from_id: currentUser.id, from_username: currentUsername, game, difficulty, score }
    );
    showStreakToast(`Challenge sent to ${friendUsername}! ⚔️`);
  } catch(e) { console.error('Challenge send failed:', e); showStreakToast('Could not send challenge.'); }
}

async function respondToChallenge(challengeId, score, verse) {
  try {
    // Calculate time bonus based on how fast they completed it
    const ch = window._activeChallenge;
    let timeBonus = 0;
    if(ch?.startedAt) {
      const elapsed = (new Date() - ch.startedAt) / 1000; // seconds
      // Max 500 pts, decays over 300 seconds (5 minutes)
      // Full bonus if under 30 seconds, zero bonus after 5 minutes
      const maxBonus = 500;
      const maxSeconds = 300;
      timeBonus = Math.max(0, Math.floor(maxBonus * (1 - elapsed / maxSeconds)));
    }
    const totalScore = score + timeBonus;

    const res = await fetch(`${SUPABASE_URL}/rest/v1/challenges?id=eq.${challengeId}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=representation' },
      body: JSON.stringify({ opponent_score: totalScore, opponent_name: currentUsername || playerName, status: 'completed', time_bonus: timeBonus })
    });
    const data = await res.json();
    const challenge = data[0];
    if(challenge) {
      const won = score > challenge.challenger_score;
      const tied = score === challenge.challenger_score;
      const msg = won
        ? `🏆 ${currentUsername} beat your challenge on ${challenge.game}! They scored ${score.toLocaleString()} vs your ${challenge.challenger_score.toLocaleString()}.`
        : tied
        ? `🤝 ${currentUsername} tied your challenge on ${challenge.game}! You both scored ${score.toLocaleString()}.`
        : `😅 ${currentUsername} accepted your challenge on ${challenge.game} but couldn't beat your score of ${challenge.challenger_score.toLocaleString()}.`;
      await createNotification(challenge.challenger_id, 'challenge_result', msg, { challenge_id: challengeId, score, challenger_score: challenge.challenger_score });
    }
    return data[0];
  } catch(e) { console.error('Challenge respond failed:', e); }
}

  const expires = new Date(challenge.expires_at);
  const hoursLeft = Math.max(0, Math.floor((expires - new Date()) / 3600000));

  const banner = document.createElement('div');
  banner.className = 'challenge-banner-overlay';
  banner.id = 'challengeBannerOverlay';
  banner.innerHTML = `
    <div class="challenge-banner-card">
      <div class="challenge-banner-swords">⚔️</div>
      <div class="challenge-banner-title">You've Been<br>Challenged!</div>
      <div class="challenge-banner-subtitle">${fromName} wants to battle</div>
      <div class="challenge-banner-from">${icon} ${game} · ${challenge.difficulty} difficulty</div>
      <div class="challenge-banner-score">
        <div class="challenge-banner-score-val">${score.toLocaleString()}</div>
        <div class="challenge-banner-score-label">Score to beat</div>
      </div>
      ${challenge.verse_book ? `<div class="challenge-banner-verse">📖 ${challenge.verse_book} ${challenge.verse_chapter}:${challenge.verse_verse}</div>` : ''}
      <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);margin-bottom:16px;">⏰ ${hoursLeft} hour${hoursLeft!==1?'s':''} remaining</div>
      <button class="btn-accept-challenge" onclick="document.getElementById('challengeBannerOverlay').remove();acceptChallenge('${challenge.id}','${challenge.game}','${challenge.difficulty}',${score},'${challenge.verse_book||''}',${challenge.verse_chapter||0},${challenge.verse_verse||0})">

      <button class="btn-decline-challenge" onclick="document.getElementById('challengeBannerOverlay').remove()">
        Maybe later

  document.body.appendChild(banner);
}

async function checkForPendingChallenges() {
  if(!currentUser) return;
  try {
    const now = new Date().toISOString();
    const challenges = await sbFetch(`challenges?opponent_id=eq.${currentUser.id}&status=eq.pending&expires_at=gt.${now}&order=created_at.desc&limit=1&select=*`);
    if(challenges.length) {
      // Only show if not already seen this session
      const seenKey = `ss_challenge_seen_${challenges[0].id}`;
      if(!sessionStorage.getItem(seenKey)) {
        sessionStorage.setItem(seenKey, '1');
        setTimeout(() => showChallengeBanner(challenges[0]), 2500);
      }
    }
  } catch(e) { console.warn("Caught:", e?.message); }
}

async function renderChallenges() {
  showBackBtn(true);
  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading challenges…</div></div>`;

  const now = new Date().toISOString();
  const [sent, received] = await Promise.all([
    sbFetch(`challenges?challenger_id=eq.${currentUser.id}&order=created_at.desc&limit=20&select=*`),
    sbFetch(`challenges?opponent_id=eq.${currentUser.id}&order=created_at.desc&limit=20&select=*`)
  ]);

  const gameIcons = { scout:'scout', trivia:'trivia', mia:'mia', track:'track' };
  const gameNames = { scout:'Scripture Scout', trivia:'Bible Trivia', mia:'Missing in Action', track:'Track It Down' };

  function renderChallenge(c, isMine) {
    const expired = new Date(c.expires_at) < new Date() && c.status === 'pending';
    const status = expired ? 'expired' : c.status;
    const myScore = isMine ? c.challenger_score : c.opponent_score;
    const theirScore = isMine ? c.opponent_score : c.challenger_score;
    const theirName = isMine ? (c.opponent_name || 'Waiting...') : c.challenger_name;
    const won = myScore !== null && theirScore !== null && myScore > theirScore;
    const tied = myScore !== null && theirScore !== null && myScore === theirScore;

    let resultText = '';
    let resultClass = '';
    if(status === 'expired') { resultText = '⏰ Expired — no response'; resultClass = 'expired'; }
    else if(status === 'pending' && isMine) { resultText = '⏳ Waiting for response...'; resultClass = 'pending'; }
    else if(status === 'pending' && !isMine) { resultText = '⚔️ Challenge waiting for you!'; resultClass = 'pending'; }
    else if(won) { resultText = '🏆 You won!'; resultClass = 'win'; }
    else if(tied) { resultText = '🤝 Tied!'; resultClass = 'win'; }
    else { resultText = '😅 You lost'; resultClass = 'lose'; }

    return `
      <div class="challenge-card ${won?'won':status==='pending'?'pending':'lost'}">
        <div class="challenge-header">
          <div class="challenge-icon">${gameIcons[c.game]||'🎮'}</div>
          <div>
            <div class="challenge-title">${gameNames[c.game]||c.game} — ${c.difficulty}</div>
            <div class="challenge-meta">${isMine ? 'You challenged' : 'Challenge from'} ${theirName} · ${timeAgo(c.created_at)}</div>
            ${c.verse_book ? `<div class="challenge-meta">📖 ${c.verse_book} ${c.verse_chapter}:${c.verse_verse}</div>` : ''}
          </div>
        </div>
        <div class="challenge-scores">
          <div class="challenge-score-box">
            <div class="challenge-score-val" style="color:var(--teal);">${(isMine ? c.challenger_score : (c.opponent_score ?? '—')).toLocaleString?.() || '—'}</div>
            <div class="challenge-score-label">Your Score</div>
          </div>
          <div style="display:flex;align-items:center;font-size:1.2rem;color:var(--text-muted);">⚔️</div>
          <div class="challenge-score-box">
            <div class="challenge-score-val" style="color:#F4B942;">${(isMine ? (c.opponent_score ?? '—') : c.challenger_score).toLocaleString?.() || '—'}</div>
            <div class="challenge-score-label">${theirName.split(' ')[0]}'s Score</div>
          </div>
        </div>
        <div class="challenge-result ${resultClass}">${resultText}</div>
        ${status === 'pending' && !isMine ? `<button class="btn-next" onclick="acceptChallenge('${c.id}','${c.game}','${c.difficulty}',${c.challenger_score},'${c.verse_book||''}',${c.verse_chapter||0},${c.verse_verse||0})" style="margin-top:0;">Accept Challenge →</button>` : ''}
      </div>`;
  }

  const allChallenges = [
    ...received.map(c => ({ ...c, _received: true })),
    ...sent.map(c => ({ ...c, _received: false }))
  ].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  root.innerHTML = `
    <div class="friends-screen">
      <div class="verse-label">⚔️ Challenges</div>
      ${allChallenges.length ? allChallenges.map(c => renderChallenge(c, !c._received)).join('') :
        `<div class="empty-state">No challenges yet!<br>Challenge a friend after finishing a game.</div>`}
      <button class="btn-change-diff" style="margin-top:12px;" onclick="showHome()">← Home</button>
    </div>`;
}

async function acceptChallenge(challengeId, game, difficulty, challengerScore, book, chapter, verse) {
  showBackBtn(true);
  const root = document.getElementById('root');

  // Record when opponent started
  const startedAt = new Date().toISOString();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/challenges?id=eq.${challengeId}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
      body: JSON.stringify({ opponent_started_at: startedAt })
    });
  } catch(e) { console.warn("Caught:", e?.message); }

  // Fetch the specific verse if provided
  let challengeVerse = null;
  if(book && chapter && verse) {
    const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&book=eq.${encodeURIComponent(book)}&chapter=eq.${chapter}&verse=eq.${verse}&select=*&limit=1`);
    if(rows.length) challengeVerse = rows[0];
  }

  // Store challenge context with start time
  window._activeChallenge = { id: challengeId, game, difficulty, challengerScore, verse: challengeVerse, startedAt: new Date() };

  // Launch the appropriate game
  root.innerHTML = `
    <div style="text-align:center;padding:20px;">
      <div style="font-size:0.78rem;font-weight:700;color:#F4B942;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;">⚔️ Challenge Mode</div>
      <div style="font-size:0.88rem;color:var(--text-muted);margin-bottom:20px;">Beat ${challengerScore.toLocaleString()} pts to win!</div>
    </div>`;

  if(game === 'scout') startChallengeScout(challengeVerse, difficulty);
  else if(game === 'mia') startChallengeMIA(challengeVerse, difficulty);
  else if(game === 'track') startChallengeTrack(challengeVerse, difficulty);
  else if(game === 'trivia') { showBackBtn(true); renderTriviaSetup(); }
}

async function startChallengeScout(verse, difficulty) {
  if(!verse) {
    const diff = difficulty || 'hard';
    const total = DIFF_COUNTS[TRANSLATION][diff];
    const offset = Math.floor(Math.random() * total);
    const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&difficulty=eq.${diff}&select=*&limit=1&offset=${offset}`);
    if(rows.length) verse = rows[0];
  }
  if(!verse) { showStreakToast('Could not load verse.'); return; }
  renderChallengeScout(verse);
}

async function startChallengeMIA(verse, difficulty) {
  if(!verse) {
    const diff = difficulty || 'hard';
    const total = DIFF_COUNTS[TRANSLATION][diff];
    const offset = Math.floor(Math.random() * total);
    const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&difficulty=eq.${diff}&select=*&limit=1&offset=${offset}`);

  }
  if(!verse) { showStreakToast('Could not load verse.'); return; }
  renderChallengeMIA(verse);
}

function challengeHUD() {
  const pc = window._pendingChallenge;
  const ac = window._activeChallenge;
  const target = ac?.challengerScore || pc?.challengerScore || null;
  const startedAt = ac?.startedAt || new Date();
  const hudId = 'challengeTimerHUD_' + Date.now();

  // Start timer interval
  setTimeout(() => {
    const el = document.getElementById('challengeSpeedBonus');
    if(!el) return;
    const interval = setInterval(() => {
      const elapsed = (new Date() - startedAt) / 1000;
      const bonus = Math.max(0, Math.floor(500 * (1 - elapsed / 300)));
      const bonusEl = document.getElementById('challengeSpeedBonus');
      if(bonusEl) bonusEl.textContent = `⚡ Speed bonus: +${bonus} pts`;
      else clearInterval(interval);
    }, 1000);
  }, 100);

  return `<div style="text-align:center;padding:12px 16px 0;">
    <div style="font-size:0.75rem;font-weight:700;color:#F4B942;text-transform:uppercase;letter-spacing:0.1em;">⚔️ Challenge Mode</div>
    ${target ? `<div style="font-size:0.82rem;color:var(--text-muted);margin-top:2px;">Beat <strong style="color:#F4B942;">${target.toLocaleString()} pts</strong> to win!</div>` : ''}
    <div id="challengeSpeedBonus" style="font-size:0.78rem;color:#F4B942;margin-top:2px;">⚡ Speed bonus: +500 pts</div>
  </div>`;
}

async function completeChallengeGame(score, verse) {
  const pc = window._pendingChallenge;
  if(pc && pc.friendId) {
    // Challenger just played — send challenge to friend
    window._pendingChallenge = null;
    await sendChallenge(pc.friendId, pc.friendUsername, pc.game, pc.difficulty, score, verse || pc.verse);
    showStreakToast(`Challenge sent to ${pc.friendUsername}! ⚔️`);
    renderChallenges();
  } else if(window._activeChallenge) {
    // Opponent responding to challenge
    await finishChallenge(score, verse);
  }
}

function renderChallengeScout(verse) {
  const root = document.getElementById('root');
  const correctTestament = verse.testament;
  const correctBook = verse.book;
  const correctChapter = parseInt(verse.chapter);
  let score = 0;
  let phase = 1;

  function _renderChallengePhase() {
    root.innerHTML = challengeHUD() + `
      <div class="card" style="max-width:560px;width:100%;margin-top:8px;">
        <div class="verse-text" style="margin-bottom:16px;">"${verse.text}"</div>
        <hr class="divider"/>
        <div id="challengePhaseArea"></div>
        <div class="feedback" id="challengeFeedback"></div>
      </div>`;

    const area = document.getElementById('challengePhaseArea');
    const fb = document.getElementById('challengeFeedback');

    if(phase === 1) {
      area.innerHTML = `
        <div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Which Testament?</div>
        <div style="display:flex;gap:10px;">
          <button class="ref-option" style="flex:1;" data-ans="OT"><img src="icons/testament-ot.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Old Testament</button>
          <button class="ref-option" style="flex:1;" data-ans="NT"><img src="icons/testament-nt.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> New Testament</button>
        </div>`;
      area.querySelectorAll('.ref-option').forEach(btn => {
        btn.onclick = () => {
          area.querySelectorAll('.ref-option').forEach(b=>b.disabled=true);
          const isCorrect = btn.dataset.ans === correctTestament;
          btn.classList.add(isCorrect?'correct':'wrong');
          if(!isCorrect) area.querySelector(`[data-ans="${correctTestament}"]`).classList.add('correct');
          if(isCorrect) { score+=300; fb.className='feedback correct'; fb.textContent='✓ Correct! +300'; playCorrect(); }
          else { fb.className='feedback wrong'; fb.textContent=`✗ It was ${correctTestament==='OT'?'Old':'New'} Testament`; playWrong(); }
          setTimeout(()=>{ phase=2; _renderChallengePhase(); }, 1200);
        };
      });
    } else if(phase === 2) {
      const books = correctTestament === 'OT' ? OT_BOOKS : NT_BOOKS;
      const wrongBooks = books.filter(b=>b[0]!==correctBook).sort(()=>Math.random()-0.5).slice(0,3).map(b=>b[0]);
      const choices = shuffle([correctBook,...wrongBooks]);
      area.innerHTML = `
        <div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Which Book?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${choices.map(c=>`<button class="ref-option" data-ans="${c}">${c}</button>`).join('')}
        </div>`;
      area.querySelectorAll('.ref-option').forEach(btn => {
        btn.onclick = () => {
          area.querySelectorAll('.ref-option').forEach(b=>b.disabled=true);
          const isCorrect = btn.dataset.ans === correctBook;
          btn.classList.add(isCorrect?'correct':'wrong');
          const correctBookBtn = area.querySelector(`[data-ans="${correctBook}"]`);
          if(!isCorrect && correctBookBtn) correctBookBtn.classList.add('correct');
          if(isCorrect) { score+=500; fb.className='feedback correct'; fb.textContent='✓ Correct! +500'; playCorrect(); }
          else { fb.className='feedback wrong'; fb.textContent=`✗ It was ${correctBook}`; playWrong(); }
          setTimeout(()=>{ phase=3; _renderChallengePhase(); }, 1200);
        };
      });
    } else {
      const wrongChapters = [];
      for(let i=0;i<3;i++) {
        let c;
        do { c=Math.max(1,correctChapter+Math.floor(Math.random()*6)-3); } while(c===correctChapter||wrongChapters.includes(c));
        wrongChapters.push(c);
      }
      const choices = shuffle([correctChapter,...wrongChapters]);
      area.innerHTML = `
        <div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Which Chapter?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${choices.map(c=>`<button class="ref-option" data-ans="${c}">Chapter ${c}</button>`).join('')}
        </div>`;
      area.querySelectorAll('.ref-option').forEach(btn => {
        btn.onclick = async () => {
          area.querySelectorAll('.ref-option').forEach(b=>b.disabled=true);
          const isCorrect = parseInt(btn.dataset.ans) === correctChapter;
          btn.classList.add(isCorrect?'correct':'wrong');
          if(!isCorrect) area.querySelector(`[data-ans="${correctChapter}"]`).classList.add('correct');
          if(isCorrect) { score+=700; fb.className='feedback correct'; fb.textContent='✓ Correct! +700'; }
          else { fb.className='feedback wrong'; fb.textContent=`✗ Chapter ${correctChapter}`; }
          setTimeout(()=>completeChallengeGame(score, verse), 1200);
        };
      });
    }
  }
  _renderChallengePhase();
}

function renderChallengeMIA(verse) {
  const root = document.getElementById('root');
  const blanks = getBlankWords(verse.text, 'hard');
  const options = blanks.map(b => generateOptions(b.word, verse.text.split(' ')));
  const blankHtml = buildBlankVerse(verse.text, blanks, 0, {});

  let challengeWordBank = [];
  let challengeAnswerRow = [];
  let challengeScore = 0;

  root.innerHTML = challengeHUD() + `
    <div class="card" style="max-width:560px;width:100%;margin-top:8px;">
      <div class="verse-label">✏️ Fill in the blanks</div>
      <div style="font-size:0.78rem;font-weight:700;color:#A78BFA;margin-bottom:10px;">📖 ${verse.book} ${verse.chapter}:${verse.verse}</div>
      <div class="blank-verse" id="challengeMIAVerse">${blankHtml}</div>
      <div id="challengeMIAInput"></div>
      <div class="feedback" id="challengeMIAFeedback"></div>
    </div>`;

  const wordList = [];
  blanks.forEach(b => wordList.push(b.word));
  const distractors = new Set();
  options.forEach(opts => opts.forEach(o => { if(!blanks.map(b=>b.word).includes(o) && !distractors.has(o)) { distractors.add(o); wordList.push(o); } }));
  challengeWordBank = shuffle(wordList).map((w,i) => ({ word:w, chipIndex:i }));

  const area = document.getElementById('challengeMIAInput');
  area.innerHTML = `
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--teal);font-weight:600;margin-bottom:6px;">Your answer:</div>
    <div id="challengeAnswerRow" class="answer-row"><span class="answer-placeholder">Tap words below…</span></div>
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;margin:10px 0 6px;">Word bank:</div>
    <div id="challengeWordBank" class="word-bank">
      ${challengeWordBank.map(w=>`<button class="word-chip" data-index="${w.chipIndex}" data-word="${w.word}">${w.word}</button>`).join('')}
    </div>
    <div id="challengeCheckArea">
      <button class="btn-next" id="challengeCheckBtn" style="background:linear-gradient(135deg,#4A7C59,#3BBFA0);margin-top:8px;" disabled>Check Answers (0/${blanks.length})</button>
    </div>`;

  function refreshChallengeVerse() {
    const verseEl = document.getElementById('challengeMIAVerse');
    if(!verseEl) return;
    const filled = {};
    challengeAnswerRow.forEach((a,i) => { if(blanks[i]) filled[blanks[i].index] = a.word; });
    verseEl.innerHTML = buildBlankVerse(verse.text, blanks, challengeAnswerRow.length, filled);
  }

  function refreshChallengeAnswerRow() {
    const row = document.getElementById('challengeAnswerRow');
    if(!row) return;
    if(challengeAnswerRow.length === 0) { row.innerHTML = '<span class="answer-placeholder">Tap words below…</span>'; return; }
    row.innerHTML = '';
    challengeAnswerRow.forEach((w,i) => {
      const chip = document.createElement('button');
      chip.className = 'answer-chip';
      chip.textContent = w.word;
      chip.addEventListener('click', () => {
        challengeAnswerRow.splice(i,1);
        document.querySelector(`#challengeWordBank .word-chip[data-index="${w.chipIndex}"]`)?.classList.remove('used');
        refreshChallengeAnswerRow();
        refreshChallengeVerse();
        updateChallengeCheckBtn();
      });
      row.appendChild(chip);
    });
  }

  function updateChallengeCheckBtn() {
    const btn = document.getElementById('challengeCheckBtn');
    if(!btn) return;
    const filled = challengeAnswerRow.length;
    btn.disabled = filled < blanks.length;
    btn.textContent = filled >= blanks.length ? 'Check Answers ✓' : `Check Answers (${filled}/${blanks.length})`;
    if(filled >= blanks.length) btn.onclick = checkChallengeMIA;
  }

  function checkChallengeMIA() {
    let correct = 0;
    blanks.forEach((blank,i) => {
      const given = challengeAnswerRow[i];
      if(given && given.word.toLowerCase() === blank.word.toLowerCase()) correct++;
    });
    challengeScore = correct * 200;
    document.querySelectorAll('#challengeWordBank .word-chip').forEach(b=>b.disabled=true);
    const row = document.getElementById('challengeAnswerRow');
    if(row) {
      row.innerHTML = blanks.map((blank,i) => {
        const given = challengeAnswerRow[i];
        const isCorrect = given && given.word.toLowerCase() === blank.word.toLowerCase();
        return `<span class="answer-chip" style="border-color:${isCorrect?'var(--teal)':'var(--earth)'};background:${isCorrect?'var(--teal-dim)':'var(--earth-dim)'};color:${isCorrect?'var(--teal)':'var(--earth)'};">${isCorrect?given.word:blank.word}</span>`;
      }).join('');
    }
    const checkArea = document.getElementById('challengeCheckArea');
    if(checkArea) checkArea.innerHTML = `<button class="btn-next" style="margin-top:8px;" onclick="completeChallengeGame(${challengeScore}, ${JSON.stringify(verse).replace(/"/g,'&quot;')})">See Results →</button>`;
  }

  document.querySelectorAll('#challengeWordBank .word-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.classList.contains('used')) return;
      if(challengeAnswerRow.length >= blanks.length) return;
      challengeAnswerRow.push({ word: btn.dataset.word, chipIndex: parseInt(btn.dataset.index) });
      btn.classList.add('used');
      refreshChallengeAnswerRow();
      refreshChallengeVerse();
      updateChallengeCheckBtn();
    });
  });
}

async function loadNotifications(force=false) {
  if(!currentUser) return [];
  // Use cache if fresh (under 10 seconds old) and not forced
  const age = Date.now() - _notifCache.lastFetched;
  if(!force && age < 10000 && _notifCache.lastFetched > 0) {
    updateNotifBadge(_notifCache.unread);
    return _notifCache.rows;
  }
  try {
    const now = new Date().toISOString();
    const [rows, friendReqs, challenges] = await Promise.all([
      sbFetch(`notifications?user_id=eq.${currentUser.id}&order=created_at.desc&limit=20&select=*`),
      sbFetch(`friends?friend_id=eq.${currentUser.id}&status=eq.pending&select=id,user_id`).catch(()=>[]),
      sbFetch(`challenges?opponent_id=eq.${currentUser.id}&status=eq.pending&expires_at=gt.${now}&select=id`).catch(()=>[])
    ]);
    const unread = rows.filter(r => !r.read).length + friendReqs.length + challenges.length;
    _notifCache = { rows, friendReqs, challenges, unread, lastFetched: Date.now() };
    updateNotifBadge(unread);
    return rows;
  } catch(e) { console.log('Notif load error:', e); return []; }
