// ═══════════════════════════════════════
// WEB PUSH (background notifications)
// ═══════════════════════════════════════
let swRegistration = null;

function isPushSupported() {
  if (IS_ANDROID_NATIVE) return !!window.Capacitor?.Plugins?.PushNotifications;
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function registerPushServiceWorker() {
  if (!isPushSupported()) return null;
  try {
    swRegistration = await navigator.serviceWorker.register('sw.js');
    return swRegistration;
  } catch(e) { console.warn('Service worker registration failed:', e?.message); return null; }
}

// 'unsupported' | 'denied' | 'default' | 'granted-not-subscribed' | 'subscribed'
async function getPushSubscriptionStatus() {
  if (IS_ANDROID_NATIVE) {
    if (!isPushSupported()) return 'unsupported';
    const perm = await window.Capacitor.Plugins.PushNotifications.checkPermissions();
    if (perm.receive === 'denied') return 'denied';
    if (perm.receive !== 'granted') return 'default';
    return localStorage.getItem('ss_fcm_token') ? 'subscribed' : 'granted-not-subscribed';
  }
  if (!isPushSupported()) return 'unsupported';
  if (Notification.permission !== 'granted') return Notification.permission;
  try {
    const reg = swRegistration || await navigator.serviceWorker.getRegistration('sw.js');
    const sub = reg && await reg.pushManager.getSubscription();
    return sub ? 'subscribed' : 'granted-not-subscribed';
  } catch(e) { return 'granted-not-subscribed'; }
}

// Registers with FCM; the actual token save to push_subscriptions happens in the
// 'registration' listener wired at bootstrap, once Android/Google Play services resolves it.
async function subscribeToPushNative() {
  const PushNotifications = window.Capacitor?.Plugins?.PushNotifications;
  if (!PushNotifications) return false;
  try {
    let perm = await PushNotifications.checkPermissions();
    if (perm.receive !== 'granted') perm = await PushNotifications.requestPermissions();
    if (perm.receive !== 'granted') {
      if (perm.receive === 'denied') showStreakToast('Notifications are blocked — enable them in your device settings.');
      return false;
    }
    await PushNotifications.register();
    return true;
  } catch(e) {
    console.warn('Native push subscribe failed:', e?.message);
    showStreakToast('Could not enable notifications.');
    return false;
  }
}

async function subscribeToPush() {
  if (!currentUser) { showStreakToast('Sign in to enable notifications.'); return false; }
  if (IS_ANDROID_NATIVE) return subscribeToPushNative();
  if (!isPushSupported()) { showStreakToast('Notifications aren\'t supported in this browser.'); return false; }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    if (permission === 'denied') showStreakToast('Notifications are blocked — enable them in your browser settings.');
    return false;
  }

  try {
    const reg = swRegistration || await registerPushServiceWorker();
    if (!reg) throw new Error('Service worker unavailable');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const subJson = sub.toJSON();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`,
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ user_id: currentUser.id, endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth })
    });
    if (!res.ok) throw new Error(`Save subscription failed: ${res.status}`);
    showStreakToast('Notifications enabled! 🔔');
    return true;
  } catch(e) {
    console.warn('Push subscribe failed:', e?.message);
    showStreakToast('Could not enable notifications.');
    return false;
  }
}

async function unsubscribeFromPush() {
  if (IS_ANDROID_NATIVE) {
    const token = localStorage.getItem('ss_fcm_token');
    try {
      await window.Capacitor?.Plugins?.PushNotifications?.unregister?.();
      if (token && currentUser) {
        await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?fcm_token=eq.${encodeURIComponent(token)}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` }
        });
      }
      localStorage.removeItem('ss_fcm_token');
      showStreakToast('Notifications turned off.');
    } catch(e) { console.warn('Native push unsubscribe failed:', e?.message); }
    return;
  }
  if (!isPushSupported()) return;
  try {
    const reg = swRegistration || await navigator.serviceWorker.getRegistration('sw.js');
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) {
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      if (currentUser) {
        await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(endpoint)}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` }
        });
      }
    }
    showStreakToast('Notifications turned off.');
  } catch(e) { console.warn('Push unsubscribe failed:', e?.message); }
}

async function togglePushNotifications() {
  const status = await getPushSubscriptionStatus();
  if (status === 'subscribed') {
    await unsubscribeFromPush();
  } else if (status === 'denied') {
    showStreakToast('Notifications are blocked — enable them in your browser settings.');
    return;
  } else {
    await subscribeToPush();
  }
  renderProfile();
}

function timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}

function computeBadges(stats, streak, scores) {
  const earned = new Set();
  const s = streak || {};
  const current = s.current_streak || 0;
  const longest = s.longest_streak || 0;
  const totalGames = stats?.games || 0;

  // Streak badges
  if(longest >= 3)   earned.add('streak_3');
  if(longest >= 7)   earned.add('streak_7');
  if(longest >= 14)  earned.add('streak_14');
  if(longest >= 30)  earned.add('streak_30');
  if(longest >= 100) earned.add('streak_100');
  if(longest >= 365) earned.add('streak_365');

  // Performance badges
  if(parseInt(localStorage.getItem('ss_perfect_hard')||0) >= 1) earned.add('perfect_1');
  if(parseInt(localStorage.getItem('ss_perfect_hard')||0) >= 10) earned.add('perfect_10');
  if(parseInt(localStorage.getItem('ss_perfect_hard')||0) >= 3) earned.add('hard_3');
  if(localStorage.getItem('ss_perfect_hard')) earned.add('endless');
  if((stats?.best||0) >= 10000) earned.add('score_10k');

  // Exploration badges
  const playedGames = new Set(scores.map(s => s.game || 'scout'));
  if(playedGames.size >= 4 || totalGames >= 4) earned.add('all_games');
  // story_start badge check removed (old story mode)
  if(parseInt(localStorage.getItem('ss_daily_completed_count')||0) >= 7) earned.add('daily_7');

  return earned;
}

async function editUsername() {
  const newName = await showTextInputModal({ title: 'Edit username', placeholder: 'Username', defaultValue: currentUsername || '', confirmLabel: 'Save' });
  if(!newName || newName === currentUsername) return;
  if(newName.length < 3) { showStreakToast('Username must be at least 3 characters!'); return; }
  if(newName.length > 20) { showStreakToast('Username must be 20 characters or less!'); return; }

  try {
    const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=minimal' };
    // Check if username taken
    const existing = await sbFetch(`profiles?username=eq.${encodeURIComponent(newName)}&select=id`);
    if(existing.length && existing[0].id !== currentUser.id) { showStreakToast('Username already taken!'); return; }
    // Update
    await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${currentUser.id}`, { method:'PATCH', headers, body: JSON.stringify({ username: newName }) });
    currentUsername = newName;
    playerName = newName;
    localStorage.setItem('ss_username', newName);
    showStreakToast('Username updated! ✅');
    renderProfile();
  } catch(e) { showStreakToast('Could not update username.'); }
}

    sbFetch(`friends?friend_id=eq.${currentUser.id}&status=eq.pending&select=*&order=created_at.desc`),

async function sendFriendRequest(friendId, friendUsername) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/friends`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ user_id: currentUser.id, friend_id: friendId, status: 'pending' })
    });
    await createNotification(friendId, 'friend_request', `${currentUsername} sent you a friend request! Tap to accept.`, { from_id: currentUser.id, from_username: currentUsername });
    showStreakToast(`✅ Friend request sent to ${friendUsername}!`);
    // Refresh to show in pending tab
    _notifCache.lastFetched = 0;
    renderFriends('requests');
  } catch(e) { showStreakToast('Could not send request — maybe already sent?'); }
}

async function acceptFriend(requestId, fromId, fromUsername) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/friends?id=eq.${requestId}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
      body: JSON.stringify({ status: 'accepted' })
    });
    await createNotification(fromId, 'friend_accept', `${currentUsername} accepted your friend request! 🤝`, { from_id: currentUser.id });
    showStreakToast(`You and ${fromUsername} are now friends!`);
    renderFriends();
  } catch(e) { console.warn("Caught:", e?.message); }
}

async function declineFriend(requestId) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/friends?id=eq.${requestId}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` }
    });
    showStreakToast('Request declined.');
    renderFriends();
  } catch(e) { console.warn("Caught:", e?.message); }
}

async function startChallengeGame(friendId, friendUsername, game, difficulty) {
  // Pick a random verse for the challenge
  const total = DIFF_COUNTS[TRANSLATION][difficulty];
  const offset = Math.floor(Math.random() * total);
  const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&difficulty=eq.${difficulty}&select=*&limit=1&offset=${offset}`);
  if(!rows.length) { showStreakToast('Could not load verse. Try again!'); return; }
  const verse = rows[0];

  // Store pending challenge info
  window._pendingChallenge = { friendId, friendUsername, game, difficulty, verse };

  // Launch the game
  showBackBtn(true);
  const root = document.getElementById('root');
  root.innerHTML = `
    <div style="text-align:center;padding:20px 16px 8px;">
      <div style="font-size:0.78rem;font-weight:700;color:#F4B942;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">⚔️ Challenge Mode</div>
      <div style="font-size:0.85rem;color:var(--text-muted);">Play your best — ${friendUsername} will try to beat you!</div>
    </div>`;

  if(game === 'scout') await startChallengeScout(verse, difficulty);
  else if(game === 'mia') await startChallengeMIA(verse, difficulty);
  else if(game === 'track') await startChallengeTrack(verse, difficulty);
  else if(game === 'trivia') { showBackBtn(true); renderTriviaSetup(); }
}

async function openDirectMessage(friendId, friendUsername) {
  showBackBtn(true);
  // Check if DM conversation exists
  const myConvs = await sbFetch(`conversation_members?user_id=eq.${currentUser.id}&select=conversation_id`);
  const friendConvs = await sbFetch(`conversation_members?user_id=eq.${friendId}&select=conversation_id`);
  const myIds = myConvs.map(c => c.conversation_id);
  const friendIds = friendConvs.map(c => c.conversation_id);
  const shared = myIds.find(id => friendIds.includes(id));

  if(shared) {
    openConversation(shared, friendUsername, 'direct');
    return;
  }

  // Create new DM conversation
  const res = await fetch(`${SUPABASE_URL}/rest/v1/conversations`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=representation' },
    body: JSON.stringify({ name: friendUsername, type: 'direct', created_by: currentUser.id })
  });
  const convData = await res.json();
  const convId = convData[0]?.id;
  if(!convId) return;

  // Add both members
  await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/conversation_members`, { method:'POST', headers:{ 'apikey':SUPABASE_KEY,'Content-Type':'application/json','Authorization':`Bearer ${authToken}`,'Prefer':'return=minimal' }, body: JSON.stringify({ conversation_id: convId, user_id: currentUser.id, username: currentUsername }) }),
    fetch(`${SUPABASE_URL}/rest/v1/conversation_members`, { method:'POST', headers:{ 'apikey':SUPABASE_KEY,'Content-Type':'application/json','Authorization':`Bearer ${authToken}`,'Prefer':'return=minimal' }, body: JSON.stringify({ conversation_id: convId, user_id: friendId, username: friendUsername }) })
  ]);

  openConversation(convId, friendUsername, 'direct');
}

async function newGroupChat() {
  const name = await showTextInputModal({ title: 'New group chat', placeholder: 'Group name', confirmLabel: 'Create', icon: '👥' });
  if(!name) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/conversations`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=representation' },
    body: JSON.stringify({ name, type: 'group', created_by: currentUser.id })
  });
  const convData = await res.json();
  const convId = convData[0]?.id;
  if(!convId) return;
  await fetch(`${SUPABASE_URL}/rest/v1/conversation_members`, { method:'POST', headers:{ 'apikey':SUPABASE_KEY,'Content-Type':'application/json','Authorization':`Bearer ${authToken}`,'Prefer':'return=minimal' }, body: JSON.stringify({ conversation_id: convId, user_id: currentUser.id, username: currentUsername }) });

let _convPollInterval = null;

async function openConversation(convId, convName, convType) {

        </div>

          ${msgs.length ? msgs.map(m => {
            const isMine = m.sender_id === currentUser.id;
            const rxns = reactionsByMsg[m.id] || [];
            const rxnGroups = {};
            rxns.forEach(r => { rxnGroups[r.emoji] = (rxnGroups[r.emoji]||0)+1; });
            let bubbleClass = isMine ? 'mine' : 'theirs';
            if(m.type==='score') bubbleClass += ' score-share';
            if(m.type==='verse') bubbleClass += ' verse-share';
            return `

                <div class="msg-bubble ${bubbleClass}" ondblclick="showReactionPicker(${m.id})">
                  ${m.type==='score'?`🏆 <strong>${m.data?.game||'Game'}</strong><br>${m.data?.score?.toLocaleString()} pts`:''}
                  ${m.type==='verse'?`📖 <strong>${m.data?.ref||''}</strong><br><em>${m.content}</em>`:''}
                  ${m.type==='text'?m.content:''}
                </div>
                ${Object.keys(rxnGroups).length?`<div class="msg-reactions">${Object.entries(rxnGroups).map(([e,c])=>`<span class="reaction-chip ${rxns.find(r=>r.emoji===e&&r.user_id===currentUser.id)?'mine':''}" onclick="toggleReaction(${m.id},'${e}')">${e} ${c}</span>`).join('')}</div>`:''}
                <div style="font-size:0.68rem;color:var(--text-muted);margin-top:2px;">${timeAgo(m.created_at)}</div>
              </div>`;
          }).join('') : `<div class="empty-state">No messages yet — say hello! 👋</div>`}
        </div>
        <div class="msg-input-bar">
          <button onclick="shareScoreInChat('${convId}')" style="background:none;border:none;cursor:pointer;font-size:1.3rem;" title="Share score">🏆</button>
          <button onclick="shareVerseInChat('${convId}')" style="background:none;border:none;cursor:pointer;font-size:1.3rem;" title="Share verse">📖</button>

      clearInterval(_convPollInterval);

let currentStreak = null; // loaded from Supabase

async function loadStreak() {
  if(!currentUser) return null;
  try {
    const rows = await sbFetch(`streaks?user_id=eq.${currentUser.id}&select=*&limit=1`);
    if(rows.length) {
      currentStreak = rows[0];
    } else {
      // Create new streak record using upsert to prevent duplicates
      const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'resolution=ignore-duplicates,return=representation' };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/streaks`, { method:'POST', headers, body: JSON.stringify({ user_id: currentUser.id, current_streak:0, longest_streak:0, freeze_tokens:0, total_days_played:0 }) });
      const data = await res.json();
      currentStreak = Array.isArray(data) && data[0] ? data[0] : { user_id: currentUser.id, current_streak:0, longest_streak:0, freeze_tokens:0, total_days_played:0 };
    }
    return currentStreak;
  } catch(e) { console.error('Load streak failed:', e); return null; }
}

async function updateStreak(bonusDay=false) {
  if(!currentUser) return;
  try {
  const streak = await loadStreak();
  if(!streak) return;

  const today = getDailyKey();
  const lastPlayed = streak.last_played_date;

  // Already played today
  if(lastPlayed === today) {
    // If bonus day (completed all daily challenges) add extra
    if(bonusDay && !streak._bonusAwardedToday) {
      await patchStreak({ current_streak: streak.current_streak + 1, longest_streak: Math.max(streak.longest_streak, streak.current_streak + 1), _bonusAwardedToday: true });
    }
    return;
  }

  // Use local date math to avoid timezone issues
  const yesterdayDate = new Date(); yesterdayDate.setDate(yesterdayDate.getDate() - 1);
  const yesterday = `${yesterdayDate.getFullYear()}-${String(yesterdayDate.getMonth()+1).padStart(2,'0')}-${String(yesterdayDate.getDate()).padStart(2,'0')}`;
  const twoDaysAgoDate = new Date(); twoDaysAgoDate.setDate(twoDaysAgoDate.getDate() - 2);
  const twoDaysAgo = `${twoDaysAgoDate.getFullYear()}-${String(twoDaysAgoDate.getMonth()+1).padStart(2,'0')}-${String(twoDaysAgoDate.getDate()).padStart(2,'0')}`;

  let newStreak = streak.current_streak;
  let newTokens = streak.freeze_tokens;
  let usedSabbath = false;

  if(lastPlayed === yesterday) {
    // Consecutive day
    newStreak++;
  } else if(lastPlayed === twoDaysAgo && streak.freeze_tokens > 0) {
    // Missed one day but has Sabbath Rest
    newStreak++;
    newTokens = Math.max(0, newTokens - 1);
    usedSabbath = true;
  } else if(!lastPlayed) {
    // First time
    newStreak = 1;
  } else {
    // Streak broken
    newStreak = 1;
    newTokens = 0;
  }

  // Award Sabbath Rest every 6 days
  if(newStreak % 6 === 0 && newStreak > 0) {
    newTokens = Math.min(3, newTokens + 1);
  }

  const newLongest = Math.max(streak.longest_streak, newStreak);
  const newTotal = (streak.total_days_played || 0) + 1;

  await patchStreak({
    current_streak: newStreak,
    longest_streak: newLongest,
    last_played_date: today,
    freeze_tokens: newTokens,
    total_days_played: newTotal,
    updated_at: new Date().toISOString()
  });

  // Show journal card — only on FIRST play of the day (new streak update)
  const sabbathEarned = newStreak % 6 === 0 && newTokens > streak.freeze_tokens;
  // Small delay so game completion screen shows first
  setTimeout(() => {
    if(usedSabbath) { playStreak(); showJournalCard(newStreak, newLongest, newTokens, false, true, false); }
    else if(sabbathEarned) { playMilestone(); showJournalCard(newStreak, newLongest, newTokens, true, false, false); }
    else if([1,2,3,7,14,30,50,100].includes(newStreak)) { playMilestone(); showJournalCard(newStreak, newLongest, newTokens, false, false, false); }
    else { playStreak(); showJournalCard(newStreak, newLongest, newTokens, false, false, false); }
  }, 1200);

  // Check for newly earned badges and queue them
  const newBadges = checkAndAwardBadges();
  if(newBadges && newBadges.length > 0) {
    queueBadgeJournals(newBadges);
  }

  // Update home streak card to done state
  } catch(e) { console.error('updateStreak error:', e); return; }
  const streakCard = document.getElementById('homeStreakCard');
  if(streakCard) {
    streakCard.classList.add('streak-card-done');
    const streakSub = document.getElementById('homeStreakSub');
    if(streakSub) { streakSub.textContent = 'streak earned today!'; streakSub.style.color = '#4a8a28'; streakSub.style.fontWeight = '700'; }
    const streakBadge = document.getElementById('homeStreakBadge');
    if(streakBadge) { streakBadge.textContent = '✓ Done'; streakBadge.style.background = '#e0f4d0'; streakBadge.style.color = '#4a8a28'; streakBadge.style.border = '1px solid #5aaa30'; }
  }
}

async function patchStreak(updates) {
  if(!currentUser || !currentStreak) return;
  try {
    const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, 'Prefer': 'return=representation' };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/streaks?user_id=eq.${currentUser.id}`, { method:'PATCH', headers, body: JSON.stringify(updates) });
    const data = await res.json();
    if(Array.isArray(data) && data[0]) currentStreak = data[0];
    else Object.assign(currentStreak, updates);
  } catch(e) { console.error('Patch streak failed:', e); }
}

let _ttsEnabled = localStorage.getItem('ss_tts') === '1';
let _ttsSpeaking = false;
let _ttsUtterance = null;

function isTTSSupported() {
  return 'speechSynthesis' in window;
}

function toggleTTS() {
  _ttsEnabled = !_ttsEnabled;
  localStorage.setItem('ss_tts', _ttsEnabled ? '1' : '0');
  if(!_ttsEnabled) stopSpeech();
  updateTTSBtn();
}

function updateTTSBtn() {
  const btn = document.getElementById('ttsToggleBtn');
  if(btn) btn.textContent = _ttsEnabled ? '🔈' : '🔇';
  btn && (btn.title = _ttsEnabled ? 'Tap to mute narration' : 'Tap to enable narration');
}

function speakText(text, onEnd) {
  if(!_ttsEnabled || !isTTSSupported()) { onEnd && onEnd(); return; }
  stopSpeech();
  _ttsUtterance = new SpeechSynthesisUtterance(text);
  _ttsUtterance.rate = 0.92;
  _ttsUtterance.pitch = 1.0;
  _ttsUtterance.volume = 1.0;

  // Try to find a good voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v =>
    v.name.includes('Daniel') || v.name.includes('Aaron') ||
    v.name.includes('Tom') || v.name.includes('Alex') ||
    (v.lang === 'en-US' && v.localService)
  ) || voices.find(v => v.lang.startsWith('en')) || voices[0];
  if(preferred) _ttsUtterance.voice = preferred;

  _ttsUtterance.onend = () => { _ttsSpeaking = false; onEnd && onEnd(); };
  _ttsUtterance.onerror = () => { _ttsSpeaking = false; onEnd && onEnd(); };
  _ttsSpeaking = true;
  window.speechSynthesis.speak(_ttsUtterance);
}

function stopSpeech() {
  if(isTTSSupported()) window.speechSynthesis.cancel();
  _ttsSpeaking = false;
}

function getJournalEntry(streak, isSabbathEarned, isSabbathUsed, isReset) {

    body: `The trail went cold. Even the best explorers lose the path sometimes.<br><br>Paul was shipwrecked three times and still wrote half the New Testament. Today is day one again.<br><br>Every expert was once a beginner. Every streak was once a single day.`,
    sign: '<strong>Streak: 1. Fresh start. No shame.</strong>',
    sabbath: false
  };

  if(isSabbathUsed) return {
    tag: '🌿 Sabbath Rest Used', tagClass: 'journal-tag-green',
    date: dateStr,
    body: `Missed yesterday. Life happened — it does that.<br><br>Good thing you had a <strong>🌿 Sabbath Rest</strong> stored up. Streak protected. No damage done.<br><br>Moses didn't cross the Red Sea on his first try either. Get back out there.`,
    sign: '<strong>Streak intact. Rest spent. Onward.</strong>',

  };

    tag: '🌿 Sabbath Rest Earned', tagClass: 'journal-tag-green',

    sign: '<strong>Selah.</strong>',
    sabbath: true
  };

  // Regular day entries
  const entries = {
    1: { tag:'📖 First Entry', tagClass:'journal-tag-blue', body:`First day in the field. The terrain is unfamiliar but the guide is sure.<br><br>Every great expedition starts with a single step. Today was mine.`, sign:`<strong>Streak: 1 day. The journey begins.</strong>` },
    2: { tag:'🔥 Day 2', tagClass:'journal-tag-fire', body:`Back again. Some explorers quit after day one — not this one.<br><br>Two days in. The Word is deeper than it looks from the outside.`, sign:`<strong>Streak: 2 days. Still going.</strong>` },
    3: { tag:'🔥 Day 3', tagClass:'journal-tag-fire', body:`Three days. You know what they say — it takes 3 days to start a habit. Ask Jonah.`, sign:`<strong>Streak: 3 days. Something's forming here.</strong>` },
    7: { tag:'🔥 Day 7', tagClass:'journal-tag-fire', body:`One full week. Seven days of creation. Seven days of showing up.<br><br>Randy approves. So does Someone with considerably more authority.`, sign:`<strong>Streak: 7 days. One week strong.</strong>` },
    14: { tag:'🔥 Day 14', tagClass:'journal-tag-fire', body:`Two weeks. Fourteen days of the Word working on you whether you noticed or not.<br><br>The disciples walked with Jesus for three years. You've got time.`, sign:`<strong>Streak: 14 days. Still here.</strong>` },
    30: { tag:'🔥 Day 30', tagClass:'journal-tag-fire', body:`Thirty days. A whole month. The psalmist said blessed is the one who meditates on the law <strong>day and night.</strong><br><br>Thirty nights counted too, just so you know.`, sign:`<strong>Streak: 30 days. The Lord is noticing.</strong>` },
    50: { tag:'🔥 Day 50', tagClass:'journal-tag-fire', body:`Fifty days. That's Pentecost. The disciples waited fifty days for the Spirit to fall.<br><br>You've been showing up every one of those days. Randy is not crying. There's just something in his eye.`, sign:`<strong>Streak: 50 days. Legendary territory.</strong>` },
    100: { tag:'🔥 Day 100', tagClass:'journal-tag-fire', body:`One hundred days. A century of faithfulness. Abraham was 100 when Isaac was born — proof that great things take time.<br><br>Randy didn't think you'd make it this far. Randy was wrong. It happens.`, sign:`<strong>Streak: 100 days. Extraordinary.</strong>` },
  };

  // Pick specific or generic

function checkAndAwardBadges() {
  if(!currentUser) return;
  const earned = getEarnedBadges();
  const newBadges = [];

  // Streak badges
  if(currentStreak) {
    const s = currentStreak.current_streak || 0;
    [
      [3,'streak_3'],[7,'streak_7'],[14,'streak_14'],
      [30,'streak_30'],[100,'streak_100'],[365,'streak_365']
    ].forEach(([days, id]) => {
      if(s >= days && !earned.has(id)) newBadges.push(id);
    });
  }

  // Score badges
  const topScore = currentStreak?.top_score || 0;
  if(topScore >= 10000 && !earned.has('score_10k')) newBadges.push('score_10k');

  // Game badges
  const played = JSON.parse(localStorage.getItem('ss_games_played') || '[]');
  if(['scout','trivia','mia','track'].every(g => played.includes(g)) && !earned.has('all_games')) {
    newBadges.push('all_games');
  }

  // Story badges — based on storyProgress, populated whenever the user has
  // visited Story Mode this session (see renderStoryMode()/renderStoryPath()).
  const storyStarted = Object.keys(storyProgress).some(k => !isNaN(parseInt(k)));
  if(storyStarted && !earned.has('story_start')) newBadges.push('story_start');

  // Daily badges
  const dailyCount = parseInt(localStorage.getItem('ss_daily_completed_count') || '0');
  if(dailyCount >= 7 && !earned.has('daily_7')) newBadges.push('daily_7');

  // OT + NT badge
  const otPlayed = localStorage.getItem('ss_ot_played') === '1';
  const ntPlayed = localStorage.getItem('ss_nt_played') === '1';
  if(otPlayed && ntPlayed && !earned.has('both_tests')) newBadges.push('both_tests');

  // Award new badges
  newBadges.forEach(id => awardBadge(id));
  return newBadges;
}

function getEarnedBadges() {
  try { return new Set(JSON.parse(localStorage.getItem('ss_earned_badges') || '[]')); }
  catch(e) { return new Set(); }
}

function awardBadge(id) {
  const earned = getEarnedBadges();
  if(earned.has(id)) return false;
  earned.add(id);
  localStorage.setItem('ss_earned_badges', JSON.stringify([...earned]));
  return true;
}

function queueBadgeJournals(badgeIds) {
  if(!badgeIds || badgeIds.length === 0) return;
  _pendingBadgeJournals.push(...badgeIds);
}

function playTone(frequency, duration, type='sine', volume=0.3, delay=0) {
  if(!_soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const oscillator = ctx.createOscillator();
    const gainNode = ctx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(ctx.destination);
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, ctx.currentTime + delay);
    gainNode.gain.setValueAtTime(0, ctx.currentTime + delay);
    gainNode.gain.linearRampToValueAtTime(volume, ctx.currentTime + delay + 0.01);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    oscillator.start(ctx.currentTime + delay);
    oscillator.stop(ctx.currentTime + delay + duration);
  } catch(e) { console.warn("Caught:", e?.message); }
}

async function fetchVerseOfDay() {
  const today = getDailyKey();
  const cacheKey = `ss_votd_${today}`;

  // Clear any stale cache from previous days
  Object.keys(localStorage).forEach(k => {
    if(k.startsWith('ss_votd_') && k !== cacheKey) localStorage.removeItem(k);
  });

  const cached = localStorage.getItem(cacheKey);
  if(cached) {
    try {
      const v = JSON.parse(cached);
      if(v && v.text) { updateVOTD(v); return; }
    } catch(e) { localStorage.removeItem(cacheKey); }
  }

  try {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const offset = (dayOfYear * 137) % 5000;
    // Use anon key directly so it works even before login
    const res = await fetch(`${SUPABASE_URL}/rest/v1/verses?translation=eq.WEB&select=book,chapter,verse,text&limit=1&offset=${offset}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if(res.ok) {
      const rows = await res.json();
      if(rows.length) {
        localStorage.setItem(cacheKey, JSON.stringify(rows[0]));
        updateVOTD(rows[0]);
      }
    }
  } catch(e) { console.log('VOTD error:', e); }
}

function updateVOTD(v) {
  const textEl = document.getElementById('votdText');
  const refEl = document.getElementById('votdRef');
  if(!textEl || !v || !v.text) return;
  textEl.textContent = `"${v.text}"`;
  if(refEl) refEl.textContent = `— ${v.book} ${v.chapter}:${v.verse}`;
}

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('ss_theme', isDark ? 'dark' : 'light');
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';
  showStreakToast(isDark ? '🌙 Dark mode' : '☀️ Light mode');
}

function initTheme() {
  const saved = localStorage.getItem('ss_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved === 'dark' || (saved === null && prefersDark);

  if(isDark) {
    document.body.classList.add('dark-mode');
  } else {
    document.body.classList.remove('dark-mode');
  }
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if(localStorage.getItem('ss_theme') !== null) return;
    if(e.matches) {
      document.body.classList.add('dark-mode');
      const btn = document.getElementById('themeToggleBtn');
      if(btn) btn.textContent = '☀️';
    } else {
      document.body.classList.remove('dark-mode');
      const btn = document.getElementById('themeToggleBtn');
      if(btn) btn.textContent = '🌙';
    }
  });
}

  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.style.opacity='0', 2500);
  setTimeout(() => toast.remove(), 3000);
}

function getStreakDisplay() {
  if(!currentStreak) return '';
  const { current_streak, freeze_tokens, last_played_date } = currentStreak;
  const today = getDailyKey();
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  const playedToday = last_played_date === today;
  const atRisk = last_played_date === yesterday && !playedToday;

  const tokens = [0,1,2].map(i =>
    `<span class="streak-token ${i < freeze_tokens ? '' : 'empty'}">🌿</span>`
  ).join('');

  return `
    ${atRisk && current_streak > 0 ? `<div class="streak-warning">⚠️ Play today to keep your ${current_streak} day streak!</div>` : ''}
    <div class="streak-bar">
      <div class="streak-fire">${playedToday ? '<img src="icons/streak-fire.svg" width="28" height="28" style="object-fit:contain;" alt="">' : '💤'}</div>
      <div class="streak-info">
        <div class="streak-count">${current_streak} day${current_streak !== 1 ? 's' : ''}</div>
        <div class="streak-label">${playedToday ? 'Streak active today' : 'Current streak'}</div>
      </div>
      <div>
        <div class="streak-tokens">${tokens}</div>
        <div style="font-size:0.68rem;color:var(--text-muted);text-align:right;margin-top:2px;">Sabbath Rests</div>
      </div>
    </div>`;
}

async function useSabbathRest() {
  if(!currentStreak || currentStreak.freeze_tokens <= 0) return;
  await patchStreak({ freeze_tokens: currentStreak.freeze_tokens - 1 });
  showStreakToast('🌿 Sabbath Rest used!');
}

function getDailyKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function isDailyCompleted(game) {
  return localStorage.getItem(`ss_dailychallenge_${game}_${getDailyKey()}`) !== null;
}

function markDailyCompleted(game, score) {
  localStorage.setItem(`ss_dailychallenge_${game}_${getDailyKey()}`, score);
}

function getDailyScore(game) {
  return parseInt(localStorage.getItem(`ss_dailychallenge_${game}_${getDailyKey()}`) || '0');
}

// Seed a number from today's date
function getDailySeed(extra='') {
  const key = getDailyKey() + extra;
  let hash = 0;
  for(let i = 0; i < key.length; i++) {
    hash = ((hash << 5) - hash) + key.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

// Function to get daily trivia questions based on today's topic
function getDailyTriviaQuestions(topic, count=5) {
  const bucket = TOPIC_BUCKET_MAP[topic] || 'general';
  
  // Get questions from matching bucket
  let pool = DAILY_TRIVIA_BANK.filter(q => q.bucket === bucket);
  
  // If not enough, add from related buckets or general pool
  if(pool.length < count) {
    const extra = DAILY_TRIVIA_BANK.filter(q => q.bucket !== bucket);
    pool = [...pool, ...extra];
  }
  
  // Shuffle and return count questions
  const shuffled = pool.sort(() => {
    // Use deterministic seed based on today's date for consistency
    const seed = getDailySeed(topic);
    return (seed % 2 === 0 ? 1 : -1) * (Math.random() - 0.5);
  });
  
  return shuffled.slice(0, count);
}


async function getDailyTopicAndVerses() {
  if(_dailyTopicCache && _dailyVersePool) return { topic: _dailyTopicCache, verses: _dailyVersePool };

  // Check localStorage cache first
  const cacheKey = `ss_daily_topic_${getDailyKey()}`;
  const cached = localStorage.getItem(cacheKey);
  if(cached) {
    try {
      const { topic, verses } = JSON.parse(cached);
      _dailyTopicCache = topic;
      _dailyVersePool = verses;
      return { topic, verses };
    } catch(e) { console.warn("Caught:", e?.message); }
  }

  // Pick today's topic from curated list using day-of-year
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const topic = DAILY_TOPICS[dayOfYear % DAILY_TOPICS.length];
  _dailyTopicCache = topic;

  // Fetch top verse references for this topic
  const topicVerses = await sbFetch(`verse_topics?topic=eq.${encodeURIComponent(topic)}&order=quality_score.desc&limit=20&select=book,chapter,verse`);

  // Fetch all matching verses in PARALLEL instead of sequential
  const versePromises = topicVerses.slice(0, 8).map(tv =>
    sbFetch(`verses?translation=eq.${TRANSLATION}&book=eq.${encodeURIComponent(tv.book)}&chapter=eq.${tv.chapter}&verse=eq.${tv.verse}&select=*&limit=1`)
      .then(rows => rows[0] || null)
      .catch(() => null)
  );
  const results = await Promise.all(versePromises);
  const pool = results.filter(Boolean).slice(0, 4);

  // Fallback if not enough verses found — no difficulty filter since column doesn't exist
  if(pool.length < 4) {
    try {
      const offset = getDailySeed('fallback') % 5000;
      const rows = await sbFetch(`verses?translation=eq.${TRANSLATION}&select=*&limit=${4-pool.length}&offset=${offset}`);
      pool.push(...rows.filter(Boolean));
    } catch(e) { console.log('Daily fallback failed:', e); }
  }

  _dailyVersePool = pool;

  // Cache in localStorage for instant loads today
  try { localStorage.setItem(cacheKey, JSON.stringify({ topic, verses: pool })); } catch(e) { console.warn("Caught:", e?.message); }

  return { topic, verses: pool };
}

async function fetchDailyLeaderboard(game) {
  const today = getDailyKey();

  return sbFetch(`leaderboard_daily?game=eq.${game}&created_at=gte.${since}&created_at=lt.${tomorrow}&order=score.desc,created_at.asc&limit=10&select=*`);
}

async function renderDailyScout(verse) {
  // Clear any stale pending challenge
  if(window._pendingChallenge?.game === 'scout') window._pendingChallenge = null;
  const root = document.getElementById('root');
  const correctTestament = verse.testament;
  const correctBook = verse.book;
  const correctChapter = parseInt(verse.chapter);
  let phase = 1; // 1=testament, 2=book, 3=chapter
  let score = 0;
  let correct = 0;

  function renderPhase() {
    root.innerHTML = `
      <div style="text-align:center;margin-bottom:12px;">
        <div style="font-size:0.78rem;font-weight:700;color:#A78BFA;text-transform:uppercase;letter-spacing:0.1em;">⚡ Daily Challenge — Scripture Scout</div>

        <hr class="divider"/>
        <div id="scoutPhaseArea"></div>
        <div class="feedback" id="scoutFeedback"></div>
      </div>`;

    const area = document.getElementById('scoutPhaseArea');
    const fb = document.getElementById('scoutFeedback');

    if(phase === 1) {
      area.innerHTML = `
        <div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Which Testament?</div>
        <div style="display:flex;gap:10px;">
          <button class="ref-option" style="flex:1;" data-ans="OT"><img src="icons/testament-ot.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Old Testament</button>
          <button class="ref-option" style="flex:1;" data-ans="NT"><img src="icons/testament-nt.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> New Testament</button>
        </div>`;
      area.querySelectorAll('.ref-option').forEach(btn => {
        btn.onclick = () => {
          area.querySelectorAll('.ref-option').forEach(b=>b.disabled=true);
          const isCorrect = btn.dataset.ans === correctTestament;
          btn.classList.add(isCorrect?'correct':'wrong');
          if(!isCorrect) area.querySelector(`[data-ans="${correctTestament}"]`).classList.add('correct');
          if(isCorrect) { score+=300; correct++; fb.className='feedback correct'; fb.textContent='✓ Correct! +300'; }
          else { fb.className='feedback wrong'; fb.textContent=`✗ It was ${correctTestament==='OT'?'Old':'New'} Testament`; }
          setTimeout(()=>{ phase=2; renderPhase(); }, 1200);
        };
      });
    } else if(phase === 2) {
      const books = correctTestament === 'OT' ? OT_BOOKS : NT_BOOKS;
      const wrongBooks = books.filter(b=>b[0]!==correctBook).sort(()=>Math.random()-0.5).slice(0,3).map(b=>b[0]);
      const choices = shuffle([correctBook,...wrongBooks]);
      area.innerHTML = `
        <div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Which Book?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${choices.map(c=>`<button class="ref-option" data-ans="${c}">${c}</button>`).join('')}
        </div>`;
      area.querySelectorAll('.ref-option').forEach(btn => {
        btn.onclick = () => {
          area.querySelectorAll('.ref-option').forEach(b=>b.disabled=true);
          const isCorrect = btn.dataset.ans === correctBook;
          btn.classList.add(isCorrect?'correct':'wrong');
          const correctBookBtn = area.querySelector(`[data-ans="${correctBook}"]`);
          if(!isCorrect && correctBookBtn) correctBookBtn.classList.add('correct');
          if(isCorrect) { score+=500; correct++; fb.className='feedback correct'; fb.textContent='✓ Correct! +500'; }
          else { fb.className='feedback wrong'; fb.textContent=`✗ It was ${correctBook}`; }
          setTimeout(()=>{ phase=3; renderPhase(); }, 1200);
        };
      });
    } else {
      // Generate wrong chapter choices safely
      const maxChapter = (correctTestament === 'OT' ? OT_BOOKS : NT_BOOKS).find(b=>b[0]===correctBook)?.[1] || 30;
      const wrongChapters = [];
      let attempts = 0;
      while(wrongChapters.length < 3 && attempts < 20) {
        attempts++;
        let c = Math.max(1, Math.min(maxChapter, correctChapter + Math.floor(Math.random()*6) - 3));
        if(c !== correctChapter && !wrongChapters.includes(c)) wrongChapters.push(c);
      }
      // Fill if needed
      while(wrongChapters.length < 3) {
        let c = Math.floor(Math.random() * maxChapter) + 1;
        if(c !== correctChapter && !wrongChapters.includes(c)) wrongChapters.push(c);
      }
      const choices = shuffle([correctChapter, ...wrongChapters]);
      area.innerHTML = `
        <div style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Which Chapter?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${choices.map(c=>`<button class="ref-option" data-ans="${c}">Chapter ${c}</button>`).join('')}
        </div>`;
      area.querySelectorAll('.ref-option').forEach(btn => {
        btn.onclick = async () => {
          area.querySelectorAll('.ref-option').forEach(b=>b.disabled=true);
          const isCorrect = parseInt(btn.dataset.ans) === correctChapter;
          btn.classList.add(isCorrect?'correct':'wrong');
          const correctBtn = area.querySelector(`[data-ans="${correctChapter}"]`);
          if(!isCorrect && correctBtn) correctBtn.classList.add('correct');
          if(isCorrect) { score+=700; correct++; fb.className='feedback correct'; fb.textContent='✓ Correct! +700'; }
          else { fb.className='feedback wrong'; fb.textContent=`✗ It was Chapter ${correctChapter}`; }
          markDailyCompleted('scout', score);
          await submitDailyScore('scout', score);
          await updateStreak();
          setTimeout(()=>showDailyResult('scout', score), 1200);
        };
      });
    }
  }
  renderPhase();
}

async function renderDailyMIA(verse) {

  const blanks = getBlankWords(verse.text, 'hard');
  const options = blanks.map(b => generateOptions(b.word, verse.text.split(' ')));
  const blankHtml = buildBlankVerse(verse.text, blanks, 0, {});

  // Daily-specific state
  let dailyMIAWordBank = [];
  let dailyMIAAnswerRow = [];
  let dailyMIAScore = 0;

  const root = document.getElementById('root');
  root.innerHTML = `
    <div style="text-align:center;margin-bottom:12px;">
      <div style="font-size:0.78rem;font-weight:700;color:#A78BFA;text-transform:uppercase;letter-spacing:0.1em;">⚡ Daily Challenge — Missing in Action</div>
    </div>
    <div class="card" style="max-width:560px;width:100%;">
      <div class="verse-label">✏️ Fill in the blanks</div>
      <div style="font-size:0.78rem;font-weight:700;color:#A78BFA;margin-bottom:10px;">📖 ${verse.book} ${verse.chapter}:${verse.verse}</div>
      <div class="blank-verse" id="dailyMIAVerse">${blankHtml}</div>
      <div id="dailyMIAInput"></div>
      <div class="feedback" id="dailyMIAFeedback"></div>
    </div>`;

  // Build word bank
  const wordList = [];
  blanks.forEach(b => wordList.push(b.word));
  options.forEach(opts => opts.forEach(o => { if(!blanks.map(b=>b.word).includes(o)) wordList.push(o); }));
  dailyMIAWordBank = shuffle(wordList).map((w,i) => ({ word:w, used:false, chipIndex:i }));

  const area = document.getElementById('dailyMIAInput');
  area.innerHTML = `
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--teal);font-weight:600;margin-bottom:6px;">Your answer:</div>
    <div id="dailyMIAAnswerRow" class="answer-row">
      <span class="answer-placeholder">Tap words below…</span>
    </div>
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;margin:10px 0 6px;">Word bank:</div>
    <div id="dailyMIAWordBank" class="word-bank">
      ${dailyMIAWordBank.map(w => `<button class="word-chip" data-index="${w.chipIndex}" data-word="${w.word}">${w.word}</button>`).join('')}
    </div>
    <div id="dailyMIACheckArea">
      <button class="btn-next" id="dailyMIACheckBtn" style="background:linear-gradient(135deg,#4A7C59,#3BBFA0);margin-top:8px;" disabled>Check Answers (0/${blanks.length})</button>
    </div>`;

  function refreshDailyMIAAnswerRow() {
    const row = document.getElementById('dailyMIAAnswerRow');
    if(!row) return;
    if(dailyMIAAnswerRow.length === 0) { row.innerHTML = '<span class="answer-placeholder">Tap words below…</span>'; return; }
    row.innerHTML = dailyMIAAnswerRow.map((a,pos) =>
      `<button class="answer-chip" onclick="removeDailyMIAWord(${pos})">${a.word}</button>`
    ).join('');
  }

  window.removeDailyMIAWord = (pos) => {
    const removed = dailyMIAAnswerRow[pos];
    if(!removed) return;
    dailyMIAAnswerRow.splice(pos, 1);
    const chip = document.querySelector(`#dailyMIAWordBank .word-chip[data-index="${removed.chipIndex}"]`);
    if(chip) chip.classList.remove('used');
    refreshDailyMIAAnswerRow();
    updateDailyMIACheckBtn();
  };

  function updateDailyMIACheckBtn() {
    const btn = document.getElementById('dailyMIACheckBtn');
    if(!btn) return;
    const filled = dailyMIAAnswerRow.length;
    btn.disabled = filled < blanks.length;
    btn.textContent = filled >= blanks.length ? 'Check Answers ✓' : `Check Answers (${filled}/${blanks.length})`;
    if(filled >= blanks.length) btn.onclick = checkDailyMIA;
  }

  function checkDailyMIA() {
    let correct = 0;
    blanks.forEach((blank, i) => {
      const given = dailyMIAAnswerRow[i];
      const isCorrect = given && given.word.toLowerCase() === blank.word.toLowerCase();
      if(isCorrect) correct++;
    });
    dailyMIAScore = correct * 200;
    document.querySelectorAll('#dailyMIAWordBank .word-chip').forEach(b => b.disabled=true);
    // Show correct answers
    const row = document.getElementById('dailyMIAAnswerRow');
    if(row) {
      row.innerHTML = blanks.map((blank,i) => {
        const given = dailyMIAAnswerRow[i];
        const isCorrect = given && given.word.toLowerCase() === blank.word.toLowerCase();
        return `<span class="answer-chip" style="border-color:${isCorrect?'var(--teal)':'var(--earth)'};background:${isCorrect?'var(--teal-dim)':'var(--earth-dim)'};color:${isCorrect?'var(--teal)':'var(--earth)'};">${isCorrect?given.word:blank.word}</span>`;
      }).join('');
    }
    const checkArea = document.getElementById('dailyMIACheckArea');
    if(checkArea) checkArea.innerHTML = `<button class="btn-next" id="dailyMIADoneBtn" style="margin-top:8px;">See Results →</button>`;
    document.getElementById('dailyMIADoneBtn').onclick = async () => {
      markDailyCompleted('mia', dailyMIAScore);
      await submitDailyScore('mia', dailyMIAScore);
      showDailyResult('mia', dailyMIAScore);
    };
  }

  function refreshDailyMIAVerse() {
    const verseEl = document.getElementById('dailyMIAVerse');
    if(!verseEl) return;
    const filled = {};
    dailyMIAAnswerRow.forEach((a, i) => { filled[blanks[i]?.index] = a.word; });
    verseEl.innerHTML = buildBlankVerse(verse.text, blanks, dailyMIAAnswerRow.length, filled);
  }

  document.querySelectorAll('#dailyMIAWordBank .word-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.classList.contains('used')) return;
      if(dailyMIAAnswerRow.length >= blanks.length) return;
      dailyMIAAnswerRow.push({ word: btn.dataset.word, chipIndex: parseInt(btn.dataset.index) });
      btn.classList.add('used');
      refreshDailyMIAAnswerRow();
      refreshDailyMIAVerse();
      updateDailyMIACheckBtn();
    });
  });

  // Also update verse when a word is removed
  window.removeDailyMIAWord = (pos) => {
    const removed = dailyMIAAnswerRow[pos];
    if(!removed) return;
    dailyMIAAnswerRow.splice(pos, 1);
    const chip = document.querySelector(`#dailyMIAWordBank .word-chip[data-index="${removed.chipIndex}"]`);
    if(chip) chip.classList.remove('used');
    refreshDailyMIAAnswerRow();
    refreshDailyMIAVerse();
    updateDailyMIACheckBtn();
  };
}

async function renderDailyTrack(verse) {
  const options = await generateRefOptions(verse, 'hard');
  const letters = ['A','B','C','D'];
  const correctRef = `${verse.book} ${verse.chapter}`;

  const root = document.getElementById('root');
  root.innerHTML = `
    <div style="text-align:center;margin-bottom:12px;">
      <div style="font-size:0.78rem;font-weight:700;color:#A78BFA;text-transform:uppercase;letter-spacing:0.1em;">⚡ Daily Challenge — Track It Down</div>
    </div>
    <div class="card" style="max-width:560px;width:100%;">
      <div class="verse-label"><img src="icons/target.svg" width="18" height="18" style="vertical-align:-4px;object-fit:contain;" alt=""> Where is this verse from?</div>
      <div class="verse-text" style="margin-bottom:16px;">"${verse.text}"</div>
      <hr class="divider"/>
      <div id="dailyTrackOptions">
        ${options.map((opt,i)=>`
          <button class="ref-option" data-ref="${opt}">
            <span class="ref-option-letter">${letters[i]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="feedback" id="dailyTrackFeedback"></div>
    </div>`;

  document.querySelectorAll('.ref-option').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.ref-option').forEach(b => b.disabled=true);
      const isCorrect = btn.dataset.ref === correctRef;
      document.querySelectorAll('.ref-option').forEach(b => {
        if(b.dataset.ref===correctRef) b.classList.add('correct');
        if(b===btn && !isCorrect) b.classList.add('wrong');
      });
      const score = isCorrect ? 500 : 0;
      const fb = document.getElementById('dailyTrackFeedback');
      if(fb) { fb.className=`feedback ${isCorrect?'correct':'wrong'}`; fb.textContent=isCorrect?'✓ Correct!':'✗ Not quite!'; }
      markDailyCompleted('track', score);
      await submitDailyScore('track', score);
      setTimeout(()=>showDailyResult('track', score), 1200);
    });
  });
}

async function renderFullDailyLeaderboard() {
  showBackBtn(true);
  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading daily leaderboard…</div></div>`;

    { id: 'track', name: 'Track It Down' }
  ];

  // Fetch all 4 leaderboards in parallel
  const results = await Promise.all(games.map(g => fetchDailyLeaderboard(g.id)));

  // Get today's topic
  const { topic } = await getDailyTopicAndVerses().catch(() => ({ topic: '' }));

  // Calculate time until midnight
  const now = new Date();
  const midnight = new Date(now);

  function renderSection(game, rows) {
    return `
      <div style="margin-bottom:16px;">
        <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;">

          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          ${rows.length ? rows.map((r,i) => `
            <div class="daily-lb-row">
              <span style="font-size:1rem;width:28px;text-align:center;">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span>
              <span style="flex:1;font-size:0.88rem;font-weight:600;color:var(--text);">${r.name}</span>
              <span style="font-size:0.88rem;font-weight:700;color:var(--teal);">${r.score.toLocaleString()}</span>
            </div>`).join('') : `<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:0.85rem;">No scores yet today — be the first!</div>`}
        </div>
      </div>`;
  }

  root.innerHTML = `
    <div class="game-lb">
      <div class="verse-label">⚡ Daily Challenge Leaderboard</div>
      ${topic ? `<div style="text-align:center;font-size:1.1rem;font-weight:700;color:#A78BFA;margin-bottom:4px;text-transform:capitalize;">${topic}</div>` : ''}
      <div style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-bottom:16px;">Resets in ${hLeft}h ${mLeft}m</div>
      ${games.map((g, i) => renderSection(g, results[i])).join('')}
      <button class="btn-change-diff" style="margin-top:8px;" onclick="renderLeaderboardHub()">← Leaderboards</button>
    </div>`;
}

async function checkMonthlyChampion() {
  const now = new Date();
  const monthKey = `ss_champion_${now.getFullYear()}_${now.getMonth()}`;
  if(localStorage.getItem(monthKey)) return; // Already shown this month

  // Only show on the 1st-3rd of the month
  if(now.getDate() > 3) return;

  // Get last month's date range
  const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const from = lastMonth.toISOString();
  const to = thisMonth.toISOString();
  const monthName = lastMonth.toLocaleString('default', { month: 'long', year: 'numeric' });

  try {
    // Fetch top 3 from each leaderboard
    const [scout, memory, mia, track] = await Promise.all([
      sbFetch(`leaderboard?difficulty=eq.easy&order=score.desc&limit=3&created_at=gte.${from}&created_at=lt.${to}&select=name,score`),
      sbFetch(`leaderboard_memory?order=score.desc&limit=3&created_at=gte.${from}&created_at=lt.${to}&select=name,score,difficulty`),
      sbFetch(`leaderboard_mia?order=score.desc&limit=3&created_at=gte.${from}&created_at=lt.${to}&select=name,score,difficulty`),
      sbFetch(`leaderboard_track?order=score.desc&limit=3&created_at=gte.${from}&created_at=lt.${to}&select=name,score,difficulty`)
    ]);

    // Only show if there are scores
    if(!scout.length && !memory.length && !mia.length && !track.length) return;

    showChampionModal(monthName, scout, memory, mia, track);
    localStorage.setItem(monthKey, '1');
  } catch(e) { console.log('Champion check failed:', e); }
}

function showChampionModal(month, scout, memory, mia, track) {
  const rankIcon = i => i===0?'🥇':i===1?'🥈':'🥉';

  function section(title, rows) {
    if(!rows.length) return '';
    return `
      <div class="champion-section">
        <div class="champion-section-title">${title}</div>
        ${rows.map((r,i) => `
          <div class="champion-row">
            <span class="champion-rank">${rankIcon(i)}</span>
            <span class="champion-name">${r.name}</span>
            <span class="champion-score">${r.score.toLocaleString()}</span>
          </div>`).join('')}
      </div>`;
  }

  const modal = document.createElement('div');
  modal.className = 'champion-modal';
  modal.id = 'championModal';
  modal.innerHTML = `
    <div class="champion-card">
      <div class="champion-header">
        <div class="champion-icon"><img src="icons/trophy.svg" width="48" height="48" style="object-fit:contain;" alt=""></div>
        <div class="champion-title">${month} Champions!</div>
        <div class="champion-subtitle">Congratulations to last month's top Scripture Scouts!</div>
      </div>
      ${section('📖 Scripture Scout', scout)}
      ${section('🗂️ Memory Trail', memory)}
      ${section('✏️ Missing in Action', mia)}
      ${section('<img src="icons/target.svg" width="16" height="16" style="vertical-align:-3px;object-fit:contain;" alt=""> Track It Down', track)}
      <button class="btn-champion-close" onclick="document.getElementById('championModal').remove()">
        🎉 Let's Play!
      </button>
    </div>`;

  document.body.appendChild(modal);
}

// Initialize Supabase client with fallback if library not loaded
const supabaseClient = (typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce' } })
  : null;

if (supabaseClient) {
  // supabase-js auto-refreshes the underlying session in the background; without this,
  // our own `authToken` mirror goes stale ~1hr in and every authenticated fetch starts failing.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
      authToken = session.access_token;
      localStorage.setItem('ss_token', session.access_token);
    } else if (event === 'SIGNED_OUT') {
      authToken = null;
    }
  });
}

if (IS_NATIVE && supabaseClient && window.Capacitor?.Plugins?.App) {
  // Catches the app being re-opened via the scripturescout://auth-callback deep link
  // after the user finishes Google sign-in in the system browser (see signInWithGoogle()).
  window.Capacitor.Plugins.App.addListener('appUrlOpen', async ({ url }) => {
    if (!url || !url.startsWith(NATIVE_OAUTH_REDIRECT)) return;
    try {
      window.Capacitor.Plugins.Browser?.close?.();
      const params = new URL(url).searchParams;
      const authCode = params.get('code');
      if (!authCode) throw new Error(params.get('error_description') || params.get('error') || 'No auth code in callback URL');
      // exchangeCodeForSession expects just the extracted code, not the full callback URL.
      const { data, error } = await supabaseClient.auth.exchangeCodeForSession(authCode);
      if (error) throw error;
      if (data?.session) {
        authToken = data.session.access_token;
        currentUser = data.session.user;
        localStorage.setItem('ss_token', data.session.access_token);
        localStorage.setItem('ss_user', JSON.stringify(data.session.user));
        const profiles = await sbFetch(`profiles?id=eq.${currentUser.id}&select=username,avatar_icon,avatar_color`).catch(() => []);
        if (profiles.length) {
          currentUsername = profiles[0].username;
          playerName = currentUsername;
          localStorage.setItem('ss_username', currentUsername);
        } else {
          playerName = currentUser.email ? currentUser.email.split('@')[0] : 'Scout';
        }
        showApp();
        if (!currentUsername) setTimeout(showUsernamePrompt, 600);
      }
    } catch(e) {
      console.warn('Google sign-in callback failed:', e?.message);
      showStreakToast('Google sign-in failed — please try again.');
    }
  });
}

if (IS_ANDROID_NATIVE && window.Capacitor?.Plugins?.PushNotifications) {
  const PushNotifications = window.Capacitor.Plugins.PushNotifications;
  // Fires some time after register() (called from subscribeToPushNative()) once
  // Google Play services actually hands back a device token.
  PushNotifications.addListener('registration', async (token) => {
    localStorage.setItem('ss_fcm_token', token.value);
    if (!currentUser || !authToken) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=fcm_token`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`,
          'Prefer': 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({ user_id: currentUser.id, platform: 'android', fcm_token: token.value })
      });
      if (!res.ok) throw new Error(`Save FCM token failed: ${res.status}`);
      showStreakToast('Notifications enabled! 🔔');
    } catch(e) { console.warn('Save FCM token failed:', e?.message); }
  });
  PushNotifications.addListener('registrationError', (err) => {
    console.warn('FCM registration error:', err?.error);
    showStreakToast('Could not enable notifications.');
  });
  // Tapping a delivered notification opens the app — land on Notifications so
  // the user can see what it was about (friend request, challenge, message, etc.).
  PushNotifications.addListener('pushNotificationActionPerformed', () => {
    if (currentUser) renderNotifications();
  });
}

(async () => {
  updateOnlineStatus();

  // Let Supabase JS handle OAuth callback automatically
  if(supabaseClient) {
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        authToken   = session.access_token;
        currentUser = session.user;
        localStorage.setItem('ss_token', session.access_token);
        localStorage.setItem('ss_user', JSON.stringify(session.user));

        try {
          const profiles = await sbFetch(`profiles?id=eq.${currentUser.id}&select=username,avatar_icon,avatar_color`);
          if(profiles.length) {
            currentUsername = profiles[0].username;
            playerName = currentUsername;
            localStorage.setItem('ss_username', currentUsername);
            currentAvatarIcon = profiles[0].avatar_icon || null;
            currentAvatarColor = profiles[0].avatar_color || 'purple';
          } else {
            playerName = currentUser.email ? currentUser.email.split('@')[0] : 'Scout';
          }
        } catch(e) { console.warn("Caught:", e?.message); }

        if(window.location.hash || window.location.search.includes('code=')) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }

        showApp();
        if(!currentUsername) setTimeout(showUsernamePrompt, 600);
        return;
      }
    } catch(e) { console.log('Supabase session check failed:', e.message); }
  }

  // Fallback — try manual token restore
  const hasSession = await restoreSession();
  if (hasSession) {
    showApp();
  } else {
    renderAuthScreen();
  }
  initTheme();
  initSound();

  if (isPushSupported()) {
    await registerPushServiceWorker();
    // If permission was already granted on a previous visit, keep the subscription alive silently
    // (covers e.g. the browser rotating the push endpoint) without re-prompting the user.
    if (Notification.permission === 'granted' && currentUser) subscribeToPush();
    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data?.type === 'notification-click' && currentUser) renderNotificationHub();
    });
  }
})();
</script>
