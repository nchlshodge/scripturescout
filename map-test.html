<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#ede3cf; padding:16px; font-family:sans-serif; }

.map-container {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  border-radius: 12px;
  border: 3px solid #c4a030;
  overflow: hidden;
  box-shadow: 0 6px 30px rgba(0,0,0,0.4);
}

.map-container img.map-bg {
  width: 100%;
  display: block;
}

.map-container svg.trail {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

.lm {
  position: absolute;
  transform: translate(-50%, -50%);
  text-align: center;
  cursor: pointer;
  z-index: 10;
}
.lm-ring {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid #c4a030;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  margin: 0 auto 4px;
}
.done   .lm-ring { background: radial-gradient(circle at 35% 35%, #f9e04b, #c8901a); }
.active .lm-ring { background: radial-gradient(circle at 35% 35%, #7a3010, #4a1804); border-color:#f4b942; animation: glow 2s infinite; }
.locked .lm-ring { background: rgba(40,28,12,0.75); border-color:#7a6030; }
.lm-label {
  font-family: Georgia, serif; font-size: 9px; font-weight: 700;
  color: #fff8ee; background: rgba(30,12,2,0.88);
  padding: 2px 6px; border-radius: 7px;
  white-space: nowrap; border: 1px solid #c4a060;
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
}
.lm-stars { font-size: 8px; color: #f4c050; margin-top: 2px; }
.locked .lm-stars { color: #7a6030; }
.randy-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 15;
  pointer-events: none;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
}
@keyframes glow {
  0%,100% { box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  50%      { box-shadow: 0 2px 22px rgba(244,185,66,0.7), 0 0 28px rgba(244,185,66,0.3); }
}
</style>
</head>
<body>

<div class="map-container" id="mapContainer">
  <img class="map-bg" id="mapImg" src="/map-bg.svg" alt="Story map">

  <svg class="trail" viewBox="0 0 576 1024" xmlns="http://www.w3.org/2000/svg">
    <path d="M288 1018 Q260 940 270 870 Q282 800 258 730 Q234 660 252 590 Q270 520 244 450 Q218 380 238 310 Q255 250 246 185 Q238 130 260 75 Q272 48 288 20"
          fill="none" stroke="#3a1a00" stroke-width="22" stroke-linecap="round" opacity="0.35"/>
    <path d="M288 1018 Q260 940 270 870 Q282 800 258 730 Q234 660 252 590 Q270 520 244 450 Q218 380 238 310 Q255 250 246 185 Q238 130 260 75 Q272 48 288 20"
          fill="none" stroke="#c4a050" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M288 1018 Q260 940 270 870 Q282 800 258 730 Q234 660 252 590 Q270 520 244 450 Q218 380 238 310 Q255 250 246 185 Q238 130 260 75 Q272 48 288 20"
          fill="none" stroke="#f0d878" stroke-width="4" stroke-linecap="round" stroke-dasharray="16 20" opacity="0.65"/>
  </svg>
</div>

<script>
// Map SVG coordinate space: 576 x 1024
// Landmark positions in SVG coords (x, y)
const landmarks = [
  { x: 262, y:  82, label: '🌍 In The Beginning', stars: '☆☆☆', state: 'active' },
  { x: 248, y: 277, label: '⭐ The Patriarchs',   stars: '🔒',   state: 'locked' },
  { x: 252, y: 481, label: '🔥 Story of Moses',   stars: '🔒',   state: 'locked' },
  { x: 258, y: 686, label: '👑 Life of David',    stars: '🔒',   state: 'locked' },
  { x: 270, y: 891, label: '✝️ Gospel Story',     stars: '🔒',   state: 'locked' },
];

const lockSVG = '<svg width="26" height="26" viewBox="0 0 44 44" fill="none"><rect x="13" y="20" width="18" height="16" rx="3" fill="#8b6914" opacity="0.8" stroke="#c4a060" stroke-width="1.5"/><path d="M16 20 L16 14 Q16 8 22 8 Q28 8 28 14 L28 20" fill="none" stroke="#c4a060" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="28" r="2.5" fill="#f4c050" opacity="0.9"/></svg>';
const compassSVG = '<svg width="26" height="26" viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="18" fill="#f4c840" opacity="0.95"/><path d="M22 7 L25 18 L22 22 L19 18 Z" fill="#c8401a"/><path d="M22 37 L25 26 L22 22 L19 26 Z" fill="#6b3010"/><path d="M37 22 L26 25 L22 22 L26 19 Z" fill="#6b3010"/><path d="M7 22 L18 25 L22 22 L18 19 Z" fill="#6b3010"/><circle cx="22" cy="22" r="3" fill="#2e1c00"/><circle cx="22" cy="22" r="1.5" fill="#c8941a"/></svg>';

function positionLandmarks() {
  const container = document.getElementById('mapContainer');
  const img = document.getElementById('mapImg');
  const W = img.offsetWidth;
  const H = img.offsetHeight;

  // Remove existing landmarks
  container.querySelectorAll('.lm, .randy-pin').forEach(el => el.remove());

  // SVG coordinate space
  const SVG_W = 576, SVG_H = 1024;

  landmarks.forEach((lm, i) => {
    const leftPx = (lm.x / SVG_W) * W;
    const topPx  = (lm.y / SVG_H) * H;

    const el = document.createElement('div');
    el.className = 'lm ' + lm.state;
    el.style.left = leftPx + 'px';
    el.style.top  = topPx  + 'px';
    el.innerHTML =
      '<div class="lm-ring">' + (lm.state === 'active' ? compassSVG : lockSVG) + '</div>'
      + '<div class="lm-label">' + lm.label + '</div>'
      + '<div class="lm-stars">' + lm.stars + '</div>';
    el.onclick = () => alert(lm.label);
    container.appendChild(el);
  });

  // Randy next to Moses (index 2)
  const moses = landmarks[2];
  const randyLeft = ((moses.x + 55) / SVG_W) * W;
  const randyTop  = ((moses.y - 25) / SVG_H) * H;

  const randy = document.createElement('div');
  randy.className = 'randy-pin';
  randy.style.left = randyLeft + 'px';
  randy.style.top  = randyTop  + 'px';
  randy.innerHTML = '<img src="/randy-default-transparent.png" width="55" height="55" alt="Randy">';
  container.appendChild(randy);
}

// Position after image loads and on resize
const img = document.getElementById('mapImg');
if (img.complete) positionLandmarks();
else img.onload = positionLandmarks;
window.addEventListener('resize', positionLandmarks);
</script>
</body>
</html>
